/* Layout: 1カラムのチャット。上に盾アイコン付きヘッダ、下に返答ドック。監視コンソールの深緑をアクセントに */

.fig .note { fill: var(--muted); }

.fig .box.ok { stroke: var(--ok); stroke-width: 2; }
.fig .box.bad { stroke: var(--bad); stroke-width: 2; }
.fig .ln { stroke: var(--ink); stroke-width: 1.4; fill: none; }

.mt { margin-top: 6px; }
/* この7日間のカレンダー */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; text-align: center; font-family: var(--f-mono); }
.week span { border: 1px solid var(--line); border-radius: 6px; padding: 2px 0; color: var(--muted); font-size: 14px; line-height: 1.3; }

.dock .col.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); align-items: stretch; }

.dock { flex: none; position: relative; z-index: 4; background: var(--bg); border-top: 1px solid var(--line); }

  net:    "ネットワークセキュリティ",
  mail:   "DNS・メール",
  ir:     "マルウェア・インシデント対応",
  mgmt:   "管理・法規・標準",
  dev:    "セキュア開発・クラウド"
};

// 4択: c[0] が正解（表示時にシャッフル）。解説は選択肢を位置ではなく用語で説明する
const QUIZ = [
  {id:"cr-1", d:"crypto", q:"AESの説明として適切なものはどれか。", c:["ブロック長128ビットで、鍵長を128・192・256ビットから選ぶ共通鍵暗号","ブロック長64ビット、実効鍵長56ビットで、3回適用する強化版もある共通鍵暗号","楕円曲線上の離散対数問題の困難性を、安全性の根拠とする公開鍵暗号方式","任意長の入力から256ビットの固定長の値を出力する、暗号学的ハッシュ関数"], e:"ブロック長64ビット・鍵長56ビットはDES（3回適用するのはトリプルDES）、離散対数問題は楕円曲線暗号、256ビットの固定長出力はSHA-256の説明です。"},
  {id:"cr-2", d:"crypto", q:"前方秘匿性（Forward Secrecy）の説明として適切なものはどれか。", c:["サーバの秘密鍵が後から漏えいしても、過去に記録した通信は復号されない性質","通信相手の証明書を検証して、なりすましたサーバとの通信を防止できる性質","同じ平文を暗号化しても、初期化ベクトルによって毎回異なる暗号文が得られる性質","共通鍵をサーバの公開鍵で暗号化して送るので、盗聴者は鍵を入手できない性質"], e:"通信ごとに使い捨ての鍵を(EC)DHEで共有するため、長期鍵が漏れても過去のセッション鍵は求められません。共通鍵をサーバの公開鍵で暗号化して送る方式（静的RSA鍵交換）は、秘密鍵が漏れると過去の通信も復号されるため前方秘匿性がありません。TLS 1.3では静的RSA鍵交換が廃止され、通常のフルハンドシェイクで前方秘匿性が確保されます。"},
  {id:"cr-3", d:"crypto", q:"ハッシュ関数の第二原像耐性の説明はどれか。", c:["あるメッセージと同じハッシュ値をもつ別のメッセージを見つけることが困難","ハッシュ値が同じになる任意のメッセージの組を、一つでも見つけることが困難","ハッシュ値だけが与えられたとき、そのハッシュ値になるメッセージを求めることが困難","入力が1ビット変わるだけで、出力のおよそ半分のビットが変化する"], e:"「任意の組を見つけることが困難」は衝突耐性、「ハッシュ値から元のメッセージを求めることが困難」は原像耐性（一方向性）です。1ビットの変化で出力が大きく変わる性質はアバランシェ効果と呼ばれます。"},
  {id:"cr-4", d:"crypto", q:"OCSPの説明として適切なものはどれか。", c:["証明書の失効状態をレスポンダに問い合わせ、その時点の状態を得るプロトコル","CAが公開する失効証明書の一覧を、利用者が定期的に取得して照合する仕組み","証明書の発行を申請するため、公開鍵と識別名を署名付きで送るデータ形式","ドメイン名の管理権限を、DNSやWebサーバに置いたトークンで確認する方式"], e:"失効証明書の一覧を定期的に取得するのはCRL、発行申請のデータ形式はCSR、トークンでドメインの管理権限を確認するのはドメイン認証（ACMEなど）です。サーバがOCSP応答を取得してTLSハンドシェイクで渡す方式をOCSPステープリングといいます。"},
  {id:"cr-5", d:"crypto", q:"ディジタル署名で、署名の生成と検証に使う鍵の組合せとして適切なものはどれか。", c:["送信者の秘密鍵で生成し、送信者の公開鍵で検証する","送信者の公開鍵で生成し、送信者の秘密鍵で検証する","受信者の公開鍵で生成し、受信者の秘密鍵で検証する","送信者の秘密鍵で生成し、受信者の秘密鍵で検証する"], e:"秘密鍵を持つのは本人だけなので、公開鍵で検証に成功すれば、本人が作成し改ざんされていないと確認できます。受信者だけが読めるように暗号化するときは、受信者の公開鍵で暗号化します。"},
  {id:"cr-6", d:"crypto", q:"HMACで確認できることとして適切なものはどれか。", c:["改ざんされていないことと、共通鍵を知る者が作成したこと","通信経路上で第三者に内容を読まれていないこと","作成者が後から作成の事実を否認できないこと","メッセージが作成された正確な日時を、第三者が証明できること"], e:"HMACは共通鍵とハッシュ関数で作るメッセージ認証コードです。鍵を共有する双方が作れるため、否認防止にはディジタル署名が必要です。日時の証明はタイムスタンプの役割です。"},
  {id:"cr-7", d:"crypto", q:"Certificate Transparency（CT）の目的として適切なものはどれか。", c:["発行された証明書を公開ログに記録し、誤発行や不正発行を見つけやすくする","失効した証明書を公開ログに記録し、ブラウザが接続のたびに必ず照合するようにする","証明書の秘密鍵を第三者機関に預け、紛失したときに復元できるようにする","TLSで暗号化された通信の内容を、監査機関が後から検証できるようにする"], e:"ドメインの管理者はCTログを監視して、身に覚えのない証明書が発行されていないかを確認できます。失効の確認はCRLやOCSPの役割です。"},
  {id:"cr-8", d:"crypto", q:"暗号利用モードGCMの特徴として適切なものはどれか。", c:["CTRモードの暗号化と認証タグの生成を組み合わせ、秘匿と改ざん検知を同時に行う","前の暗号文ブロックと次の平文ブロックのXORをとってから暗号化し、同じ平文でも異なる暗号文にする","各ブロックを独立に同じ鍵で暗号化するため、同じ平文ブロックは同じ暗号文ブロックになる","カウンタ値を暗号化して得た系列と平文のXORで暗号化し、改ざんを検知する機能はもたない"], e:"GCMはAEAD（認証付き暗号）の代表で、TLS 1.3でも使われます。同じ鍵でナンス（IV）を再利用すると安全性が崩れます。前の暗号文ブロックとXORをとるのはCBC、ブロックを独立に暗号化するのはECB、改ざん検知のないカウンタ方式はCTRです。"},
  {id:"cr-9", d:"crypto", q:"ハイブリッド暗号方式の説明として適切なものはどれか。", c:["データは共通鍵暗号で暗号化し、その共通鍵を受信者の公開鍵で暗号化して送る","データは受信者の公開鍵で暗号化し、その公開鍵を共通鍵暗号で暗号化して送る","データを共通鍵暗号と公開鍵暗号で二重に暗号化し、どちらか一方でも復号できるようにする","データは送信者の秘密鍵で暗号化し、復号に使う共通鍵をそのまま添付して送る"], e:"処理の速い共通鍵暗号で大量のデータを暗号化し、鍵の受け渡しの問題を公開鍵暗号で解決する方式です。S/MIMEやPGPがこの方式です。"},
  {id:"cr-10", d:"crypto", q:"耐量子計算機暗号（PQC）への移行が求められている理由として適切なものはどれか。", c:["大規模な量子計算機が実現すると、RSAや楕円曲線暗号が現実的な時間で解読されるおそれがあるから","量子計算機ではAESなどの共通鍵暗号が、鍵長に関係なく総当たりより速く必ず解読できるようになるから","量子鍵配送を導入するには、既存の公開鍵暗号をすべて同時に廃止しなければならないから","量子計算機の普及でハッシュ関数の出力長が足りなくなり、電子署名が一切作れなくなるから"], e:"Shorのアルゴリズムで素因数分解や離散対数問題が効率よく解けるためです。共通鍵暗号はGroverのアルゴリズムの影響を受けますが、鍵長を長くすれば対応できます。NISTは2024年にML-KEMなどの標準（FIPS 203〜205）を公開しました。"},
  {id:"cr-11", d:"crypto", q:"セキュアブートの説明として適切なものはどれか。", c:["起動時にファームウェアやOSローダの署名を検証し、改ざんされたプログラムの実行を防ぐ","OSの起動後にウイルス対策ソフトが全ファイルを検査し、感染していれば起動を中断する","ディスク全体を暗号化し、起動時にパスワードを入力しないと内容を読めないようにする","起動に失敗したとき、前回正常に起動したときの構成へ自動で戻して再起動する"], e:"起動の各段階で次に動くプログラムの署名を確認します。TPMと組み合わせると、起動時の測定値をもとに改ざんの有無を確認できます。ディスク全体の暗号化はBitLockerなどの機能です。"},
  {id:"cr-12", d:"crypto", q:"HSM（Hardware Security Module）を利用する主な目的はどれか。", c:["耐タンパ性のある装置内で鍵を生成・保管し、鍵を外に出さずに暗号処理する","暗号化の処理を専用回路で高速化し、ディスクの読み書きの性能を向上させる","利用者の生体情報を登録しておき、指紋や顔の照合で本人確認を行う","暗号化された通信を一時的に復号し、マルウェアを検査してから再び暗号化する"], e:"CAの署名鍵や決済システムの鍵など、漏えいすると影響が大きい鍵の保護に使います。暗号化通信を復号して検査するのはTLSインスペクションの機能です。"},
  {id:"cr-13", d:"crypto", q:"CRYPTREC暗号リストの説明として適切なものはどれか。", c:["電子政府での利用を推奨する暗号技術などを、安全性と実装性の評価に基づいてまとめたリスト","日本からの輸出が規制されている暗号技術を、経済産業省がまとめて公表したリスト","IPAが毎年発表する、組織と個人が注意すべき情報セキュリティの脅威の順位","暗号モジュールが要求される安全性の要件を満たしているかを試験・認証する、米国政府の制度"], e:"電子政府推奨暗号リスト、推奨候補暗号リスト、運用監視暗号リストで構成されます。脅威の順位は「情報セキュリティ10大脅威」、米国の暗号モジュール認証はFIPS 140です。"},
  {id:"cr-14", d:"crypto", q:"サーバ証明書のチェーンを検証するとき、信頼の起点になるものはどれか。", c:["ブラウザやOSにあらかじめ格納されているルートCAの自己署名証明書","サーバ証明書に記載された、サーバ自身のFQDNとそのサーバの公開鍵","中間CAの証明書に記載されている、発行者の識別名と有効期間の情報","OCSPレスポンダが返す、サーバ証明書の失効状態を示す応答"], e:"サーバ証明書→中間CA証明書→ルートCA証明書と署名をたどり、最後に信頼済みのルート証明書に行き着けば検証成功です。サーバが中間CA証明書を送っていないと、検証に失敗することがあります。"},

  {id:"au-1", d:"auth", q:"パスワードをハッシュ化して保存するときに、ソルトを付加する主な目的はどれか。", c:["利用者ごとに異なるハッシュ値にし、事前計算表による解析を難しくする","ハッシュ値から元のパスワードを、正規の管理者だけが復元できるようにする","ハッシュ計算を何度も繰り返し、1回の照合にかかる時間を意図的に長くする","パスワードを暗号化する鍵を、データベースとは別のサーバに分けて保管する"], e:"レインボーテーブルなどの事前計算表への対策です。計算を繰り返して時間をかけるのはストレッチングで、ソルトと組み合わせて使います（bcryptやArgon2など）。"},
  {id:"au-2", d:"auth", q:"FIDO2（WebAuthn）による認証の特徴として適切なものはどれか。", c:["端末内の秘密鍵で署名し、サーバには公開鍵だけを登録する。署名はオリジンに結び付く","パスワードに加えて、SMSで届くワンタイムパスワードを入力させ、二つの要素を確認する","端末で読み取った指紋や顔の生体情報をサーバへ送り、登録済みの生体情報と照合する","サーバと端末で同じ共通鍵を共有し、時刻をもとに生成した使い捨ての値を照合する"], e:"署名がアクセス先のオリジンに結び付くため、偽サイトに中継されても使えず、フィッシングに強い方式です。生体情報は端末内で鍵の利用を許可するためだけに使われ、サーバには送られません。"},
  {id:"au-3", d:"auth", q:"OAuth 2.0の主な目的はどれか。", c:["リソースへのアクセス権限を、アクセストークンによってクライアントに委譲する","利用者を認証した結果を、署名付きのIDトークンで連携先のサービスに伝える","複数のサービスで同じパスワードを使えるよう、パスワードを安全に同期する","利用者の属性情報をXMLのアサーションでやり取りし、シングルサインオンを実現する"], e:"OAuth 2.0は「認可」の仕組みです。IDトークンで認証結果を伝えるのはOpenID Connect（OAuth 2.0の上に作られた仕様）、XMLのアサーションを使うのはSAMLです。"},
  {id:"au-4", d:"auth", q:"OAuth 2.0のPKCEの目的として適切なものはどれか。", c:["認可コードが横取りされても、正規のクライアント以外がトークンを取得できないようにする","認可サーバから受け取ったアクセストークンの有効期間を、利用のたびに延長する","リダイレクトURIを利用者が自由に指定できるようにして、利便性を高める","クライアントシークレットを認可リクエストのURLに含めて、クライアントを認証する"], e:"クライアントがcode_verifierを生成し、そのハッシュ値（code_challenge）を認可リクエストに含めます。トークン要求時にcode_verifierを示せるのは、正規のクライアントだけです。"},
  {id:"au-5", d:"auth", q:"OAuth 2.0やOpenID Connectの認可リクエストで、stateパラメータを使う主な目的はどれか。", c:["認可応答を自分が開始したリクエストと対応付け、CSRFを防ぐ","IDトークンに値を埋め込ませ、同じIDトークンの再利用（リプレイ）を防ぐ","アクセストークンで許可する操作の範囲を、認可サーバに伝える","利用者の同意画面に表示する、クライアントの名前とロゴを指定する"], e:"攻撃者の認可応答を利用者に処理させる攻撃を防ぎます。IDトークンのリプレイ対策はnonce、許可する範囲の指定はscopeです。"},
  {id:"au-6", d:"auth", q:"SAMLによるシングルサインオンの説明として適切なものはどれか。", c:["IdPが発行した署名付きアサーションをSPが検証し、ログインを許可する","SPが利用者のパスワードを保管し、ログインのたびにIdPへ照会して確認する","同じ親ドメインの各サービスでCookieを共有し、ログイン状態を引き継ぐ","利用者の端末にクライアント証明書を配布し、各サービスと相互に認証する"], e:"アサーションはXMLで、IdPのディジタル署名が付きます。SPは署名を検証することで、改ざんされていない認証結果だと確認できます。"},
  {id:"au-7", d:"auth", q:"リスクベース認証の説明として適切なものはどれか。", c:["普段と異なる端末や場所からのアクセスなど、リスクが高いときだけ追加の認証を求める","パスワードの強度を判定し、弱いパスワードの利用者には操作できる機能を制限する","ログインのたびに、知識・所持・生体の三つの要素すべてで本人を確認する","一定回数ログインに失敗したアカウントを、管理者が解除するまで利用停止にする"], e:"利用者の手間を増やさずに不正ログインを防ぐ方式です。端末情報、IPアドレス、アクセス時間帯などを判定に使います。"},
  {id:"au-8", d:"auth", q:"ゼロトラストの考え方として適切なものはどれか。", c:["社内からのアクセスも信頼せず、要求のたびに利用者・端末・状況を検証して認可する","ファイアウォールの内側を安全な領域とみなし、外部との境界の防御を重点的に強化する","一度認証に成功した利用者には、セッション中はすべての資源へのアクセスを許可する","VPNで社内に接続した端末は、社内の端末と同じく信頼できるものとして扱う"], e:"「内側は安全」という境界型防御の前提が、クラウド利用やテレワークの広がりで成り立たなくなったことが背景です。"},
  {id:"au-9", d:"auth", q:"Kerberos認証で、利用者がサービスを利用するときにサーバへ提示するものはどれか。", c:["TGTを使ってKDCから取得したサービスチケット","利用者のパスワードを平文のまま格納した認証チケット","サービスのサーバが利用者に直接発行したセッションCookie","KDCが利用者ごとに発行したクライアント証明書"], e:"最初に認証サービスからTGTを受け取り、TGTを示してチケット発行サービスからサービスチケットを得ます。チケットの有効期限を確認するため、各機器の時刻同期が必要です。"},
  {id:"au-10", d:"auth", q:"Pass-the-Hash攻撃の説明として適切なものはどれか。", c:["窃取したパスワードのハッシュ値を、そのまま認証に使ってなりすます","窃取したハッシュ値から、元のパスワードを総当たりやレインボーテーブルで解析する","ハッシュ値を計算するたびにソルトを変え、ログイン失敗の検知を回避する","ハッシュ関数の衝突を利用し、別のパスワードで認証を通過する"], e:"NTLM認証ではハッシュ値そのものが認証に使えるため、パスワードを解析しなくてもなりすませます。端末ごとにローカル管理者のパスワードを変える（LAPSなど）ことで、横展開を防ぎます。"},
  {id:"au-11", d:"auth", q:"最小権限の原則の説明として適切なものはどれか。", c:["利用者やプログラムに、業務に必要な最小限の権限だけを与える","権限の付与や変更は、できるだけ少ない人数の管理者だけで承認して行う","アクセスログは、法令で求められる最小限の期間だけ保存して削除する","パスワードは、最小文字数さえ満たせば複雑さは問わないことにする"], e:"侵害されたときの被害を小さくするための原則です。管理者アカウントと日常業務用アカウントを分けることも、この原則の実践です。"},
  {id:"au-12", d:"auth", q:"多要素認証に該当する組合せはどれか。", c:["パスワードと、スマートフォンのアプリに表示される使い捨てのコード","パスワードと、事前に登録した秘密の質問（母親の旧姓など）への回答","指紋による認証と、顔画像による認証を続けて行う組合せ","社員証のICカードと、そのICカードに格納されたクライアント証明書"], e:"知識（パスワード）と所持（スマートフォン）の異なる要素を組み合わせています。パスワードと秘密の質問はどちらも知識、指紋と顔はどちらも生体、ICカードと格納された証明書はどちらも所持で、同じ要素の組合せです。"},
  {id:"au-13", d:"auth", q:"アカウントロック機能の問題点として適切なものはどれか。", c:["攻撃者がわざと失敗を繰り返すことで、正規の利用者をログインできなくできる","利用者IDを固定してパスワードを次々に変える、総当たり攻撃を防げない","ロックされるとパスワードのハッシュ値が削除され、利用者の再登録が必要になる","ロックを解除するたびに、パスワードを必ず初期値に戻さなければならない"], e:"サービス妨害に悪用できます。また、IDごとの失敗回数を数える方式では、パスワードを固定してIDを変えるリバースブルートフォース攻撃は防げません。"},
  {id:"au-14", d:"auth", q:"JWT（JSON Web Token）を受け取ったサーバが行うべき検証として適切なものはどれか。", c:["署名を検証し、ヘッダのalgは信用せず、許可したアルゴリズムだけを受け付ける","ペイロードがBase64URLで正しく符号化されていれば、改ざんはないと判断する","有効期限（exp）は発行者側の責任なので、受け取った側では確認しない","algがnoneの場合は署名の検証を省略して、ペイロードの内容をそのまま使う"], e:"Base64URLは符号化であって暗号化や署名ではありません。algにnoneを指定した改ざんトークンを受け付ける実装は、過去に多くの脆弱性の原因になりました。exp、aud、issの確認も必要です。"},

  {id:"at-1", d:"attack", q:"他のサービスから漏えいした利用者IDとパスワードの組を、そのまま使ってログインを試みる攻撃はどれか。", c:["パスワードリスト攻撃","リバースブルートフォース攻撃","パスワードスプレー攻撃","レインボーテーブル攻撃"], e:"パスワードの使い回しを狙った攻撃で、クレデンシャルスタッフィングとも呼ばれます。正しい組を使うためログインの失敗が少なく、アカウントロックで検知しにくいのが特徴です。"},
  {id:"at-2", d:"attack", q:"よく使われるパスワードを一つ固定し、利用者IDを次々に変えてログインを試みる攻撃はどれか。", c:["リバースブルートフォース攻撃","クレデンシャルスタッフィング","辞書攻撃","ブルートフォース攻撃"], e:"IDごとの失敗回数は少ないため、IDごとのアカウントロックでは防げません。少数のよく使われるパスワードを多数のIDに試す手口は、パスワードスプレー攻撃とも呼ばれます。送信元ごとの試行回数の監視などで対処します。"},
  {id:"at-3", d:"attack", q:"水飲み場型攻撃の説明はどれか。", c:["標的の組織の従業員がよく見るWebサイトを改ざんし、閲覧した端末を感染させる","偽の無線LANアクセスポイントを設置し、接続した端末の通信を盗聴して情報を得る","大量の利用者に無差別にメールを送り、添付ファイルを開かせて感染を広げる","正規サイトとよく似たドメイン名を取得し、入力を誤った利用者を偽サイトへ誘導する"], e:"特定の組織を狙う標的型攻撃の一種で、閲覧元のIPアドレスを見て標的の組織にだけ攻撃コードを返すこともあります。よく似たドメイン名で誘導する手口はタイポスクワッティングです。"},
  {id:"at-4", d:"attack", q:"SYNフラッド攻撃の説明と対策の組合せとして適切なものはどれか。", c:["SYNを大量に送り、接続待ちの状態を増やして資源を枯渇させる。対策はSYN Cookie","ACKを大量に送り、既存のTCP接続を強制的に切断させる。対策はウィンドウサイズの縮小","ICMPエコー要求をブロードキャスト宛てに送り、応答を増幅させる。対策はTTLの延長","断片化したUDPパケットを送り、再構成の処理で資源を消費させる。対策はMTUの拡大"], e:"送信元を偽装したSYNに対しサーバはSYN/ACKを返し、ACKを待つ半開きの接続が溜まります。SYN Cookieは、接続の状態を保持せずにSYN/ACKを返す仕組みです。"},
  {id:"at-5", d:"attack", q:"サイドチャネル攻撃の説明はどれか。", c:["処理時間や消費電力など物理的な情報を観測し、秘密鍵などを推測する","利用者に電話をかけ、管理者を装ってパスワードなどの秘密情報を聞き出す","ソフトウェアの更新の配布経路に侵入し、正規の更新にマルウェアを混入させる","正規の利用者の通信を記録しておき、後から同じ内容を再送して認証を通過する"], e:"タイミング攻撃や電力解析攻撃が代表例です。電話で聞き出すのはソーシャルエンジニアリング、更新経路への混入はサプライチェーン攻撃、記録した通信の再送はリプレイ攻撃です。"},
  {id:"at-6", d:"attack", q:"ARPスプーフィングの説明はどれか。", c:["偽のARP応答でゲートウェイのMACアドレスを詐称し、通信を自分の端末に経由させる","偽のDNS応答をキャッシュサーバに記憶させ、利用者を偽のWebサイトへ誘導する","送信元IPアドレスを詐称して大量の応答を発生させ、標的の回線を埋め尽くす","正規のアクセスポイントと同じSSIDの偽アクセスポイントを設置し、通信を中継する"], e:"同一セグメント内での中間者攻撃です。スイッチのダイナミックARPインスペクションなどで防ぎます。"},
  {id:"at-7", d:"attack", q:"DNSリフレクション攻撃の説明として適切なものはどれか。", c:["送信元を標的のIPアドレスに詐称してオープンリゾルバに問い合わせ、大きな応答を標的へ送らせる","偽の応答をキャッシュサーバに記憶させ、利用者を攻撃者が用意した偽のWebサイトへ誘導する","存在しないランダムなサブドメインを大量に問い合わせ、権威DNSサーバを過負荷にする","DNSの問合せにデータを埋め込み、ファイアウォールを迂回して外部のサーバと通信する"], e:"小さな問合せで大きな応答を返させる「増幅」を利用したDDoS攻撃です。偽の応答を記憶させるのはキャッシュポイズニング、ランダムなサブドメインを問い合わせるのはランダムサブドメイン攻撃、問合せにデータを埋め込むのはDNSトンネリングです。"},
  {id:"at-8", d:"attack", q:"Active Directory環境でGolden Ticket攻撃を行うために、攻撃者が入手するものはどれか。", c:["krbtgtアカウントのパスワードハッシュ","一般利用者がサービスの利用時に取得したサービスチケット","ドメインコントローラのサーバ証明書と、その公開鍵","利用者の端末に設定されたローカル管理者のパスワード"], e:"krbtgtのハッシュがあれば、任意の利用者のTGTを偽造できます。侵害が疑われるときは、krbtgtのパスワードを2回変更して既存のチケットを無効にします。"},
  {id:"at-9", d:"attack", q:"侵入した攻撃者が、組織内の他の端末やサーバへ侵害を広げていく行動を何というか。", c:["ラテラルムーブメント（横展開）","権限昇格","偵察（Reconnaissance）","データの持ち出し（Exfiltration）"], e:"窃取した認証情報や管理共有、リモート管理ツールを悪用して広がります。管理者アカウントの分離や端末間の通信制限が対策になります。"},
  {id:"at-10", d:"attack", q:"ビジネスメール詐欺（BEC）の説明として適切なものはどれか。", c:["取引先や経営者になりすましたメールで、偽の口座へ送金させる","不特定多数の利用者に当選を装ったメールを送り、手数料の名目で金銭をだまし取る","社内のメールサーバを停止させ、復旧と引換えに暗号資産で身代金を要求する","正規の通販サイトを装ったメールで偽サイトに誘導し、クレジットカード番号を盗む"], e:"取引先のメールアカウントが乗っ取られ、実際のやり取りに割り込まれることもあります。振込先の変更は、電話など別の経路で確認するのが対策です。"},
  {id:"at-11", d:"attack", q:"MITB（Man-in-the-Browser）攻撃の説明として適切なものはどれか。", c:["端末に感染したマルウェアがブラウザの通信を改ざんし、送金先などを書き換える","公衆無線LANの偽アクセスポイントで通信を中継し、暗号化されていない内容を盗み見る","Webサイトに不正なスクリプトを埋め込み、閲覧者のCookieを攻撃者のサーバへ送らせる","利用者の端末とWebサーバの間に別のサーバを置き、TLSを終端して通信を中継する"], e:"正規のサイトと正規の通信路を使うため、TLSや多要素認証だけでは防げません。取引内容を別の経路で確認するトランザクション署名が対策になります。"},
  {id:"at-12", d:"attack", q:"ドライブバイダウンロード攻撃の説明はどれか。", c:["Webサイトを閲覧しただけで、気づかないうちにマルウェアがダウンロードされ実行される","利用者が自分の判断で入手したフリーソフトに、マルウェアがあらかじめ同梱されている","USBメモリを挿しただけで、自動実行の設定によってマルウェアが実行される","正規のソフトウェアの更新ファイルに、開発元の段階でマルウェアが混入される"], e:"ブラウザやプラグインの脆弱性を悪用します。改ざんされた正規サイトが入口になることも多く、ソフトウェアを最新に保つことが基本の対策です。"},
  {id:"at-13", d:"attack", q:"リプレイ攻撃の対策として有効なものはどれか。", c:["認証のたびに異なるチャレンジ値やタイムスタンプを使う","通信の内容を共通鍵暗号で暗号化して、盗聴されても読めないようにする","パスワードを長く複雑なものにして、推測されにくくする","認証に失敗したら、そのアカウントを一定時間ロックする"], e:"暗号化されたままの通信を再送するだけでも成立するため、暗号化だけでは防げません。毎回変わる値を認証に含めることで、古い通信を使い回せなくします。"},

  {id:"wb-1", d:"web", q:"クロスサイトスクリプティングの根本的な対策として適切なものはどれか。", c:["Webページに出力する値に含まれる特殊文字をエスケープする","SQL文の組立てに、プレースホルダ（バインド機構）を用いる","CookieにSecure属性を付けて、HTTPSのときだけ送信させる","入力値の文字数に上限を設け、長いスクリプトを受け付けない"], e:"<や\"などをHTMLの文字参照に変換し、スクリプトとして解釈されないようにします。Content Security Policy（CSP）やHttpOnly属性は、被害を小さくする保険的な対策です。プレースホルダはSQLインジェクションの対策です。"},
  {id:"wb-2", d:"web", q:"SQLインジェクションの根本的な対策として適切なものはどれか。", c:["プレースホルダ（バインド機構）を用いてSQL文を組み立てる","入力値に含まれる<や>を、文字参照に置き換えてから処理する","Webサーバとデータベースサーバ間の通信を、TLSで暗号化する","SQLのエラーメッセージに詳細な原因を表示して、早く気づけるようにする"], e:"入力値がSQL文の構文として解釈されなくなります。DBアカウントの権限を最小にするのは、被害を小さくする保険的な対策です。詳細なエラーメッセージの表示は、攻撃の手がかりを与えるので避けます。"},
  {id:"wb-3", d:"web", q:"CSRF（クロスサイトリクエストフォージェリ）の対策として適切なものはどれか。", c:["推測困難なトークンをフォームに埋め込み、送信時にセッションと照合する","画面に出力する値の特殊文字をエスケープし、スクリプトの実行を防ぐ","パスワードを、ソルトを付けてハッシュ化してからデータベースに保存する","セッションIDをURLのパラメータに含め、Cookieを使わないようにする"], e:"罠サイトからはトークンの値が分からないため、正規の画面からの送信だけを受け付けられます。CookieのSameSite属性や、重要な操作の前のパスワード再入力も有効です。"},
  {id:"wb-4", d:"web", q:"CookieにHttpOnly属性を付けたときの効果はどれか。", c:["JavaScriptからCookieを読めなくし、XSSでのセッションID窃取を防ぐ","HTTPSで通信しているときだけCookieを送信させ、盗聴による漏えいを防ぐ","他のサイトから送られたリクエストにはCookieを付けず、CSRFを防ぎやすくする","ブラウザを閉じた時点でCookieを削除させ、共用PCでの漏えいを防ぐ"], e:"HTTPSのときだけ送信させるのはSecure属性、他サイトからのリクエストへの付与を制限するのはSameSite属性です。有効期限を付けないCookieは、ブラウザの終了時に削除されます。"},
  {id:"wb-5", d:"web", q:"SSRF（Server Side Request Forgery）の説明はどれか。", c:["細工したURLをサーバに処理させ、内部ネットワークなどへサーバからアクセスさせる","利用者のブラウザに不正なスクリプトを実行させ、表示内容やCookieを盗み取る","ログイン中の利用者に、意図しない更新リクエストを別のサイトから送信させる","入力値にOSのコマンドを埋め込み、Webサーバ上で任意のコマンドを実行させる"], e:"外部からは届かない内部の資源やクラウドのメタデータに、サーバを踏み台にしてアクセスする攻撃です。アクセス先の許可リスト化などで対策します。ブラウザでスクリプトを実行させるのはXSS、意図しないリクエストはCSRF、コマンドの埋め込みはOSコマンドインジェクションです。"},
  {id:"wb-6", d:"web", q:"HSTS（HTTP Strict Transport Security）の効果として適切なものはどれか。", c:["HSTSヘッダを受け取ったブラウザに、期間中はHTTPSだけで接続させる","接続のたびに、サーバ証明書の失効状態を認証局へ問い合わせて確認させる","HTTPのリクエストとレスポンスのヘッダ部分だけを暗号化し、盗聴を防ぐ","レスポンスヘッダからWebサーバの製品名やバージョンを削除し、攻撃の手がかりを減らす"], e:"HTTPSのレスポンスでStrict-Transport-Securityヘッダを受け取ると、max-ageの期間中はHTTPでの接続をHTTPSに切り替えます。HTTPSへの切替えを妨げる攻撃（SSLストリッピング）の対策です。初回アクセスも守るにはプリロードリストに登録します。"},
  {id:"wb-7", d:"web", q:"セッション固定攻撃の対策として適切なものはどれか。", c:["ログインに成功した時点で、新しいセッションIDを発行し直す","セッションIDを推測されないよう、十分な桁数の連番で発行する","セッションIDの有効期限をなくし、再ログインの回数を減らす","ログイン前に発行したセッションIDを、ログイン後もそのまま使い続ける"], e:"攻撃者が事前に用意したセッションIDを利用者に使わせ、ログイン後にそのIDでなりすます攻撃です。連番のセッションIDは推測されやすく、それ自体が脆弱性です。"},
  {id:"wb-8", d:"web", q:"ディレクトリトラバーサル攻撃の説明はどれか。", c:["「../」などを含むファイル名を指定し、公開ディレクトリ外のファイルを読み出す","Webサーバの設定ミスを突いて、ディレクトリ内のファイル一覧を表示させる","大量のURLに短時間でアクセスして、Webサーバの処理能力を枯渇させる","URLに含まれるセッションIDを、Refererヘッダ経由で外部のサイトに漏えいさせる"], e:"ファイル名を外部から直接指定させない設計にするか、ファイル名からディレクトリ部分を取り除いて扱います。"},
  {id:"wb-9", d:"web", q:"OSコマンドインジェクションの対策として最も適切なものはどれか。", c:["シェルを経由する外部コマンドの呼出しを使わず、言語のライブラリ関数で実装する","OSコマンドの実行結果を、エスケープしてから画面に表示する","Webサーバを管理者権限で動かし、コマンドの実行が失敗しないようにする","実行するコマンド名をURLのパラメータで受け取り、利用者が選べるようにする"], e:"やむを得ずシェルを使う場合は、引数に使える文字を許可リストで限定します。実行結果のエスケープはXSSの対策で、コマンドの実行そのものは防げません。"},
  {id:"wb-10", d:"web", q:"クリックジャッキングの対策として適切なものはどれか。", c:["CSPのframe-ancestorsで、他サイトのフレーム内での表示を禁止する","CookieにSameSite属性を付け、他サイトからのリクエストに付与されないようにする","画面に出力する値をエスケープして、スクリプトとして実行されないようにする","ボタンが押された回数を記録し、短時間に連続して押された操作は受け付けないようにする"], e:"透明にしたフレームで正規サイトを重ね、利用者に意図しない操作をさせる攻撃です。フレーム内での表示を禁止すれば成立しません。"},
  {id:"wb-11", d:"web", q:"オープンリダイレクトの脆弱性が悪用されると起きることはどれか。", c:["正規サイトのURLを経由して、利用者を攻撃者の偽サイトへ誘導される","正規サイトのデータベースの内容を、攻撃者が直接読み出せるようになる","利用者のCookieが、別のドメインのサイトにもそのまま送信されるようになる","Webサーバ上の任意のファイルを、攻撃者が書き換えられるようになる"], e:"URLのドメインが正規のものなので、利用者が信用しやすくなります。リダイレクト先は固定するか、許可リストで限定します。OAuthのリダイレクトURIの検証が甘いと、認可コードの横取りにもつながります。"},
  {id:"wb-12", d:"web", q:"APIサーバが、リクエストのOriginヘッダの値をそのままAccess-Control-Allow-Originに返し、Access-Control-Allow-Credentialsをtrueにしていた。この設定の問題はどれか。", c:["任意のサイトのスクリプトから、ログイン中の利用者の権限でAPIの応答を読み取られる","同一オリジンからのリクエストまでブラウザに拒否され、Webアプリ全体が動作しなくなる","APIの応答がキャッシュされなくなり、サーバの負荷が大きく増える","Cookieが暗号化されずに送信されるため、通信経路で盗聴される"], e:"CORSの設定ミスです。許可するオリジンは固定の許可リストで照合します。"},
  {id:"wb-13", d:"web", q:"XML外部実体参照（XXE）攻撃の対策として適切なものはどれか。", c:["XMLパーサの設定で、DTDや外部実体の読込みを無効にする","XML文書をHTTPSで送受信し、通信経路での改ざんを検知できるようにする","XML文書のタグ名をすべて小文字に統一してから解析する","XML文書のサイズに上限を設け、大きい文書は分割して解析する"], e:"外部実体でサーバ上のファイルを読み込ませたり、内部ネットワークへアクセスさせたり（SSRF）する攻撃です。"},
  {id:"wb-14", d:"web", q:"次のJavaScriptで、URLのフラグメントを使った攻撃を防ぐ修正として適切なものはどれか。\nel.innerHTML = decodeURIComponent(location.hash.slice(1));", c:["innerHTMLではなくtextContentに代入し、文字列として表示する","サーバ側の出力処理に、HTMLのエスケープ処理を追加する","location.hashの代わりにlocation.searchの値を使う","代入する前に、文字列の長さが100文字以下であることを確認する"], e:"DOM-based XSSです。フラグメント（#以降）はサーバに送られないため、サーバ側の対策では防げません。値をHTMLとして解釈させないことが対策です。"},

  {id:"nt-1", d:"net", q:"IPSとIDSの違いの説明として適切なものはどれか。", c:["IPSは通信経路上に置いて不正な通信を遮断でき、IDSは主に検知と通知を行う","IDSは通信経路上に置いて不正な通信を遮断でき、IPSは検知と通知だけを行う","IPSはサーバにだけ導入する製品で、IDSはネットワークにだけ設置する製品である","IDSは暗号化された通信も復号せずに中身まで検査でき、IPSは平文だけを検査する"], e:"IPSはインラインで設置するため、誤検知すると正常な通信も止まります。誤検知（フォールスポジティブ）と見逃し（フォールスネガティブ）の区別も頻出です。"},
  {id:"nt-2", d:"net", q:"WAFの説明として適切なものはどれか。", c:["HTTPの内容を検査し、SQLインジェクションなどWebアプリへの攻撃を遮断する","IPアドレスとポート番号の組合せだけで、通信の許可と拒否を判断して制御する","受信したメールの添付ファイルを検査し、マルウェアを含むものを隔離する","無線LANの電波を監視し、許可されていないアクセスポイントを検知する"], e:"脆弱性を修正するまでの暫定対策としても使われます。HTTPSの内容を検査するには、WAFでTLSを終端する必要があります。"},
  {id:"nt-3", d:"net", q:"IPsecにおけるIKEの役割はどれか。", c:["通信相手を認証し、暗号化に使う鍵を交換してSAを確立する","パケットのデータ部を暗号化して、通信内容の秘匿を実現する","パケットに認証データを付けて、完全性と送信元を確認する","NAPT装置の変換表を作り、ポート番号のないパケットを通す"], e:"データ部の暗号化はESP、暗号化せずに完全性と送信元を確認するのはAHです。IKEはUDP 500番（NATトラバーサル時は4500番）を使います。"},
  {id:"nt-4", d:"net", q:"IEEE 802.1XのEAP-TLSの特徴として適切なものはどれか。", c:["認証サーバと端末の双方が、ディジタル証明書で相手を認証する","サーバ証明書でTLSトンネルを作り、その中でパスワードを使って利用者を認証する","端末のMACアドレスを登録しておき、一致した端末だけを接続させる","事前に共有したパスフレーズから鍵を作り、全端末で同じ鍵を使う"], e:"端末側にもクライアント証明書が必要です。TLSトンネルの中でパスワード認証するのはPEAPやEAP-TTLSです。"},
  {id:"nt-5", d:"net", q:"上から順に評価し、最初に一致したルールを適用するファイアウォールで、ルールの最後に置くのが適切なものはどれか。", c:["すべての通信を拒否するルール","すべての通信を許可するルール","DMZのWebサーバへのHTTPSを許可するルール","内部から外部へのDNSを許可するルール"], e:"必要な通信だけを許可し、それ以外を拒否する許可リスト方式（ホワイトリスト方式）が原則です。範囲の広いルールを上に置くと、下の個別のルールが評価されなくなります。"},
  {id:"nt-6", d:"net", q:"TLS 1.3の特徴として適切なものはどれか。", c:["静的RSA鍵交換が廃止され、通常のハンドシェイクでは(EC)DHEで鍵を共有する","互換性のため、共通鍵暗号にRC4やCBCモードの暗号スイートを引き続き使える","ハンドシェイクのメッセージはすべて平文で送られ、Finishedだけが暗号化される","サーバ証明書の検証が不要になり、自己署名証明書でも警告が出なくなった"], e:"ServerHello以降のハンドシェイクは暗号化され、暗号スイートはAEAD（AES-GCMなど）に限定されました。0-RTTのデータは前方秘匿性がなく、リプレイされうる点に注意します。"},
  {id:"nt-7", d:"net", q:"DMZに公開サーバを置く主な目的はどれか。", c:["公開サーバが侵害されても、内部LANへ被害が広がるのを防ぐ","公開サーバを内部LANに置くより、Webの応答を速くする","インターネットから内部LANの端末を、直接操作できるようにする","グローバルIPアドレスの消費を減らし、アドレスを節約する"], e:"DMZから内部LANへの通信は原則禁止にします。内部LANからDMZへの通信も、必要な宛先とポートに限定します。"},
  {id:"nt-8", d:"net", q:"WPA3-Personalで採用された、オフライン辞書攻撃に強い鍵確立の方式はどれか。", c:["SAE","PSK","TKIP","WEP"], e:"SAE（Simultaneous Authentication of Equals）により、キャプチャしたハンドシェイクからパスフレーズを総当たりで割り出す攻撃に強くなりました。WPA2のPSKはこの攻撃に弱く、TKIPとWEPは脆弱な古い方式です。"},
  {id:"nt-9", d:"net", q:"テレワーク端末のVPNでスプリットトンネルを有効にしたときの、セキュリティ上の懸念はどれか。", c:["インターネット宛ての通信が、社内の監視や防御の仕組みを通らなくなる","社内宛ての通信が、すべて暗号化されずに送られるようになる","VPN装置での認証が不要になり、誰でも接続できるようになる","端末に割り当てるIPアドレスが、社内とインターネットで重複しやすくなる"], e:"インターネット宛ての通信は端末から直接出ていくため、社内のプロキシやログによる監視が効きません。端末側でのEDRやクラウド型のプロキシ（SWG）で補います。"},
  {id:"nt-10", d:"net", q:"自組織から送信元IPアドレスを詐称したパケットが出ていくのを防ぐ対策はどれか。", c:["出口で、自組織のアドレス以外を送信元とするパケットを破棄する","入口で、送信元が自組織のアドレスになっているパケットを破棄する","すべての通信をプロキシ経由にして、送信元アドレスを書き換える","外部から届くICMPのエコー要求を、すべて破棄する"], e:"イグレスフィルタリングと呼ばれ、自組織がDDoS攻撃の踏み台になるのを防ぎます。外部から入ってくる「送信元が自組織のアドレス」のパケットを捨てるのは、イングレスフィルタリングです。"},
  {id:"nt-11", d:"net", q:"SNMPv3で追加されたセキュリティ機能はどれか。", c:["利用者ごとの認証と、メッセージの暗号化","コミュニティ名による簡易なアクセス制御","トラップをTCPで確実に届ける再送の機能","MIBの値を書き換えられないようにする機能"], e:"SNMPv1・v2cのコミュニティ名は平文で送られるため、盗聴されると機器の情報を読み取られたり設定を変えられたりします。"},
  {id:"nt-12", d:"net", q:"TLS通信を復号して検査するプロキシ（TLSインスペクション）を導入するとき、利用者の端末に必要な設定はどれか。", c:["プロキシが証明書の発行に使うCAの証明書を、信頼するルート証明書として登録する","接続先となる各Webサーバのサーバ証明書を、あらかじめ端末にインストールする","端末のブラウザでTLSを無効にし、すべての通信をHTTPで送るように設定する","プロキシのサーバ証明書に対応する秘密鍵を、端末にもコピーして保管する"], e:"プロキシは接続先ごとにサーバ証明書をその場で発行するため、その発行元のCAを端末が信頼している必要があります。金融機関などのサイトは検査の対象外にする運用もあります。"},
  {id:"nt-13", d:"net", q:"SSHで初めて接続するときに表示される、ホスト鍵のフィンガープリントを確認する目的はどれか。", c:["接続先が、なりすまされたサーバでないことを確かめるため","利用者のパスワードが、正しく暗号化されたことを確かめるため","通信に使う暗号アルゴリズムの強度が、十分かを確かめるため","利用者の公開鍵が、サーバに正しく登録されたことを確かめるため"], e:"確認せずに受け入れると、中間者攻撃を見逃します。正規のフィンガープリントは、サーバの管理者から別の経路で入手します。"},
  {id:"nt-14", d:"net", q:"ハニーポットの説明として適切なものはどれか。", c:["攻撃者を誘い込むおとりのシステムを用意し、攻撃の手法を観察する","通信を本番と同じ形で複製し、検査用の装置に送って分析する","外部と内部の境界に二重のファイアウォールを置き、緩衝地帯を作る","疑わしいファイルを隔離した環境で実行し、挙動から悪性を判定する"], e:"通信を複製して送るのはミラーポート（スパンポート）、ファイアウォールで作る緩衝地帯はDMZ、隔離環境での実行はサンドボックスです。"},

  {id:"ml-1", d:"mail", q:"SPFの説明として適切なものはどれか。", c:["許可する送信サーバのIPアドレスをDNSで公開し、受信側が照合する","メールの本文とヘッダに電子署名を付け、受信側が公開鍵を使って検証する","メールサーバ間のSMTP通信を、TLSで暗号化してから送信する","受信側がとるべき処理方針と、集計レポートの送付先をDNSで公開する"], e:"SPFはエンベロープFrom（MAIL FROM）のドメインを検証します（MAIL FROMが空のエラーメールなどはHELOのドメイン）。電子署名を使うのはDKIM、通信路の暗号化はSTARTTLS、処理方針の公開はDMARCです。"},
  {id:"ml-2", d:"mail", q:"DKIMの検証に用いる公開鍵の入手方法として適切なものはどれか。", c:["署名のドメインとセレクタから、DNSのTXTレコードを参照する","メールに添付された送信者の証明書から、公開鍵を取り出して使う","送信元のメールサーバにSMTPで接続し、公開鍵を要求して受け取る","受信者が事前に、全ての送信者から公開鍵を受け取っておく"], e:"DKIM-Signatureヘッダのd=（ドメイン）とs=（セレクタ）から、「セレクタ._domainkey.ドメイン」のTXTレコードを引きます。"},
  {id:"ml-3", d:"mail", q:"DMARCの説明として適切なものはどれか。", c:["SPF・DKIMの結果とヘッダFromを照合し、失敗時の処理方針をDNSで示す","送信を許可するメールサーバのIPアドレスを、DNSのTXTレコードに列挙する","メールの添付ファイルからマクロなどを取り除き、無害化してから配送する","メール本文を受信者の公開鍵で暗号化し、受信者だけが読めるようにする"], e:"方針はnone・quarantine・rejectの3段階です。利用者が目にするヘッダFromのなりすましを防げる点が、SPFやDKIM単独との違いです。"},
  {id:"ml-4", d:"mail", q:"OP25B（Outbound Port 25 Blocking）の説明として適切なものはどれか。", c:["ISPが、動的IPアドレスから外部のTCP 25番ポートへの通信を遮断する","メールサーバが、外部からの25番ポートへの接続をすべて拒否する","メールを送るときに、SMTP-AUTHでの利用者認証を必ず求める","25番ポートを使うSMTP通信を、STARTTLSで必ず暗号化してから送らせる"], e:"マルウェアに感染した端末からの迷惑メールの送信を防ぎます。利用者はサブミッションポート（587番）とSMTP-AUTHでメールを送ります。"},
  {id:"ml-5", d:"mail", q:"DNSSECの効果として適切なものはどれか。", c:["応答に付いた署名を検証し、応答の改ざんや偽装を検知できる","問合せと応答を暗号化し、通信路での盗聴を防止できる","権威DNSサーバへのDDoS攻撃を、署名の検証で遮断できる","ゾーン転送を禁止して、ゾーン情報の漏えいを防止できる"], e:"DNSSECは真正性と完全性を保証しますが、暗号化はしません。通信内容の秘匿は、DNS over HTTPS（DoH）やDNS over TLS（DoT）の役割です。"},
  {id:"ml-6", d:"mail", q:"クラウドのリソースを削除した後、そのリソースを指すCNAMEレコードを自社のDNSに残したままにすると生じるリスクはどれか。", c:["第三者が同名のリソースを取得し、自社のサブドメインで内容を公開できる","自社のDNSサーバが、外部からの再帰問合せに応答するようになる","自社ドメインを送信元とするメールが、受信側で必ず拒否されるようになる","ゾーン全体のDNSSEC署名が無効になり、名前解決ができなくなる"], e:"サブドメインテイクオーバーと呼ばれます。不要になったDNSレコードは、リソースの削除と同時に消すことが対策です。"},
  {id:"ml-7", d:"mail", q:"カミンスキー型のDNSキャッシュポイズニングの対策として有効なものはどれか。", c:["問合せの送信元ポート番号をランダム化する","キャッシュのTTLをできるだけ長く設定する","権威DNSサーバでゾーン転送を許可する","フルリゾルバを外部にも公開する"], e:"存在しないサブドメインを次々に問い合わせさせて偽の応答を送り込むため、TTLを長くしても防げません。IDとポート番号の両方を推測させないことと、DNSSECによる検証が対策です。"},
  {id:"ml-8", d:"mail", q:"オープンリゾルバの状態を解消する設定として適切なものはどれか。", c:["キャッシュサーバが再帰問合せを受け付ける送信元を、自組織のネットワークに限定する","権威DNSサーバのゾーン情報を、外部のDNSサーバからも転送できるようにする","キャッシュサーバのTTLを短くして、古い情報が残らないようにする","キャッシュサーバと権威DNSサーバを一台に集約し、外部からの問合せはすべてそこで受ける"], e:"オープンリゾルバはDNSリフレクション攻撃の踏み台にされます。キャッシュサーバと権威DNSサーバは分けて運用するのが原則です。"},
  {id:"ml-9", d:"mail", q:"S/MIMEで実現できることはどれか。", c:["メールの暗号化と電子署名による、盗聴防止と送信者の確認","メールサーバ間の通信路の暗号化による、経路上の盗聴防止","送信元ドメインのIPアドレス照合による、なりすましの検知","迷惑メールの自動判定による、不要なメールの隔離"], e:"S/MIMEは証明書を使ってメール自体を保護するため、サーバに保存された状態でも内容が守られます。通信路の暗号化はSTARTTLS、IPアドレスの照合はSPFです。"},
  {id:"ml-10", d:"mail", q:"パスワード付きZIPファイルをメールで送り、パスワードを別のメールで送る運用の問題点として適切なものはどれか。", c:["同じ経路なので両方とも盗聴されうるうえ、暗号化で添付のマルウェア検査ができない","ZIPの暗号化は強度が高すぎるため、受信者が解凍に長い時間を要してしまう","パスワードを別のメールに分けると、迷惑メールとして自動で削除されてしまう","ZIPファイルにパスワードを付けると、ファイルサイズが大きくなって送れなくなる"], e:"マルウェアの拡散にも悪用されてきた手口です。クラウドストレージの共有リンクで受け渡すなどの代替策があります。"},
  {id:"ml-11", d:"mail", q:"DNS over HTTPS（DoH）の効果として適切なものはどれか。", c:["名前解決の問合せと応答を暗号化し、通信路での盗聴や改ざんを防ぐ","応答の署名を検証し、権威DNSサーバが作成した正しい応答かを確認する","サーバ証明書の情報をDNSに登録し、TLS接続のときに照合できるようにする","Webサーバへの通信をDNSサーバが中継し、通信の内容を検査する"], e:"署名の検証はDNSSEC、証明書の情報をDNSに登録するのはDANEです。端末が独自にDoHを使うと、組織のDNSでの監視やフィルタリングをすり抜ける点にも注意します。"},
  {id:"ml-12", d:"mail", q:"メールのヘッダFromとエンベロープFromの説明として適切なものはどれか。", c:["ヘッダFromはメールソフトに表示され、エンベロープFromはSMTPのMAIL FROMで指定する","エンベロープFromはメールソフトに表示され、ヘッダFromはSMTPのMAIL FROMで指定する","ヘッダFromとエンベロープFromは、常に同じ値でなければメールが配送されない","エラーメールの宛先にはエンベロープFromは使われず、ヘッダFromが使われる"], e:"二つは別々に指定でき、異なっていても配送されます。エラーメールはエンベロープFrom宛てに返ります。SPFはエンベロープFrom、DMARCはヘッダFromを基準にします。"},

  {id:"ir-1", d:"ir", q:"ランサムウェアへの備えとして、バックアップの取り方で最も適切なものはどれか。", c:["ネットワークから切り離した媒体や、変更できない領域にも世代管理して保管する","業務サーバと同じ共有フォルダに、毎日最新の状態を上書きして保管する","利用者ごとのPCのデスクトップに、重要なファイルの複製を保管しておく","バックアップの代わりにRAIDで冗長化し、ディスクの故障に備えて運用する"], e:"ネットワーク経由で到達できるバックアップは、本体と一緒に暗号化されることがあります。復旧手順を定期的に訓練しておくことも重要です。RAIDは故障対策で、暗号化や削除からは守れません。"},
  {id:"ir-2", d:"ir", q:"マルウェアに感染した疑いのある端末を見つけたときの初動として適切なものはどれか。", c:["電源は切らずにネットワークから切り離し、CSIRTに報告する","被害を止めるため、すぐに電源を切ってから担当部署に報告する","ウイルス対策ソフトで駆除し、問題がなければ業務を再開する","感染の痕跡をなくすため、OSを再インストールしてから報告する"], e:"電源を切るとメモリ上の痕跡が失われます。被害の拡大を防ぎつつ、証拠を保全することを優先します。"},
  {id:"ir-3", d:"ir", q:"デジタルフォレンジックスで、証拠の完全性を保つ方法として適切なものはどれか。", c:["ディスクの複製を作ってハッシュ値を記録し、解析は複製に対して行う","原本のディスクから直接起動し、OSのログを画面で順に確認していく","解析の邪魔になる一時ファイルを削除してから、ディスクを複製する","調査担当者の記憶をもとに、操作の時系列を後からまとめて記録する"], e:"ハッシュ値で原本と複製が同一であることを示し、誰がいつ扱ったかの記録（証拠保全の一貫性）も残します。"},
  {id:"ir-4", d:"ir", q:"EDRの説明として適切なものはどれか。", c:["端末の挙動を記録・監視し、侵害の検知や調査、端末の隔離を支援する","既知のマルウェアのパターンファイルと照合し、一致したファイルを駆除する","送信元のドメインを認証し、なりすましメールを受信前に隔離する","Webアプリへの攻撃をHTTPの内容から検知し、通信を遮断する"], e:"侵入されることを前提に、侵入後の検知と対応を素早く行うための製品です。パターンファイルとの照合を中心とする従来型のウイルス対策（EPP）を補完します。"},
  {id:"ir-5", d:"ir", q:"C&Cサーバとの通信を見つける方法として適切なものはどれか。", c:["プロキシのログで、一定の間隔で同じ外部ホストと通信している端末を探す","メールサーバのログで、社内宛てのメールの送信件数が多い利用者を探す","Webサーバのアクセスログで、404エラーが多いURLを探して修正する","ファイルサーバの空き容量を監視し、急に減った共有フォルダを探す"], e:"感染端末はC&Cサーバへ定期的に接続（ビーコン）して指令を待ちます。プロキシ認証に失敗し続ける通信のログも手がかりになります。"},
  {id:"ir-6", d:"ir", q:"サンドボックスによるマルウェア検知の説明として適切なものはどれか。", c:["疑わしいファイルを隔離した環境で動かし、その挙動から悪性かどうかを判定する","既知のマルウェアのハッシュ値と照合し、一致したファイルだけを悪性と判定する","ファイルの拡張子とアイコンから、実行ファイルの偽装かどうかを判定する","ファイルを暗号化して隔離領域に保管し、管理者の承認後に利用者へ渡す"], e:"未知のマルウェアも検知できますが、仮想環境であることを検知すると動作を止める回避手法もあります。"},
  {id:"ir-7", d:"ir", q:"SIEMの説明として適切なものはどれか。", c:["複数の機器のログを集めて相関分析し、インシデントの兆候を検知する","端末の挙動を記録し、侵害された端末をネットワークから隔離する","脆弱性診断の結果を集め、修正の優先順位を自動で決定する","不審なメールを自動で隔離し、利用者に開封させないようにする"], e:"FW、プロキシ、サーバ、EDRなどのログを突き合わせて分析します。各機器の時刻が同期していることが前提です。端末の隔離はEDRの機能です。"},
  {id:"ir-8", d:"ir", q:"IoC（Indicator of Compromise）の例として適切なものはどれか。", c:["C&Cサーバのドメイン名","組織の情報セキュリティポリシーを改定した履歴","従業員に実施した標的型メール訓練の結果","ファイアウォールに設定したルールの件数"], e:"侵害の痕跡を示す情報で、他組織と共有して検知に役立てます。ハッシュ値やIPアドレスは攻撃者が簡単に変えられるため、攻撃の手口（TTP）の把握も重要です。"},
  {id:"ir-9", d:"ir", q:"CSIRTの役割として適切なものはどれか。", c:["インシデントの受付や分析、対応の調整を行う","情報システムの開発プロジェクトで、進捗と品質を管理する","会計監査の一環として、財務諸表の正確性を確認する","全社のIT資産の購入を一括で審査し、承認する"], e:"社内外の窓口（PoC）として、他組織のCSIRTやJPCERT/CCとの連携も担います。"},
  {id:"ir-10", d:"ir", q:"ランサムウェアによる二重恐喝（二重の脅迫）の説明として適切なものはどれか。", c:["暗号化に加え、事前に盗んだデータを公開すると脅して支払いを迫る","暗号化したデータの復号鍵を2回に分けて販売し、それぞれ支払いを要求する","同じ組織に2種類のランサムウェアを感染させ、別々に身代金を要求する","暗号化の前にバックアップを2世代とも削除し、自力での復旧を不可能にする"], e:"バックアップから復旧できても、情報漏えいの脅迫は残ります。データの持ち出しを検知する仕組みも必要です。"},
  {id:"ir-11", d:"ir", q:"インシデント対応の「封じ込め」に当たる対応はどれか。", c:["感染した端末を隔離し、通信先への接続を遮断する","原因となった脆弱性を修正し、マルウェアを完全に削除する","バックアップからデータを戻し、業務を再開する","対応の経緯をまとめ、再発防止策を決める"], e:"一般的な流れは、検知・分析→封じ込め→根絶→復旧→事後対応です。脆弱性の修正とマルウェアの削除は根絶、データを戻すのは復旧、経緯のまとめは事後対応に当たります。"},
  {id:"ir-12", d:"ir", q:"標的型攻撃メール訓練の主な目的はどれか。", c:["不審なメールに気づき、開封しても速やかに報告できるようにする","開封した従業員を特定して、人事評価で処分の対象にする","メールサーバの迷惑メールフィルタの検知率を、実際の攻撃で測定する","攻撃者が使うメールアドレスを特定して、今後の受信を拒否する"], e:"開封した人を責めると報告が遅れます。早く報告されるほど、被害の拡大を防げます。"},

  {id:"mg-1", d:"mgmt", q:"サイバー保険への加入は、リスク対応のどれに当たるか。", c:["リスク移転","リスク回避","リスク低減","リスク保有"], e:"損失の負担を第三者（保険会社）に移します。リスクのある業務そのものをやめるのがリスク回避です。"},
  {id:"mg-2", d:"mgmt", q:"サーバの冗長化によって主に高まる情報セキュリティの要素はどれか。", c:["可用性","機密性","完全性","真正性"], e:"必要なときに使える状態を保つのが可用性です。機密性・完全性・可用性の3要素に、真正性・責任追跡性・否認防止・信頼性を加えて7要素とすることもあります。"},
  {id:"mg-3", d:"mgmt", q:"不正アクセス禁止法で処罰の対象となる行為はどれか。", c:["他人のIDとパスワードを無断で入力し、アクセス制御されたサーバにログインする","アクセス制御のない公開Webページを、内容を保存する目的で一日に何度も閲覧する","自分に付与されたIDで、許可された範囲の社内ファイルを業務のために参照する","セキュリティの技術書を購入し、攻撃手法を学ぶ勉強会を社内で開催する"], e:"他人のIDやパスワードを不正に取得・保管・提供する行為や、フィッシングサイトの開設も処罰の対象です。"},
  {id:"mg-4", d:"mgmt", q:"個人情報保護法で、漏えいが1件でも発生したら個人情報保護委員会への報告が必要になるものはどれか。", c:["要配慮個人情報が含まれる個人データの漏えい","社員の氏名と内線番号だけが含まれる、社内名簿の漏えい","高度な暗号化をし、復号鍵は漏えいしていない個人データの漏えい","本人の同意を得て、委託先に提供した個人データの利用"], e:"ほかに、財産的被害が生じるおそれがあるもの、不正の目的によるおそれがあるもの、1,000人を超えるものも、報告と本人への通知が必要です。"},
  {id:"mg-5", d:"mgmt", q:"CVSSの説明として適切なものはどれか。", c:["脆弱性の深刻度を、ベンダに依存しない共通の基準で数値化する方法","公開された脆弱性に、一意の識別番号を付けて管理するための仕組み","ソフトウェアの脆弱性の種類を、体系的に分類して識別する仕組み","ソフトウェアを構成するコンポーネントを一覧にした、部品表の形式"], e:"識別番号を付けるのはCVE、脆弱性の種類の分類はCWE、構成部品の一覧はSBOMです。CVSS v4.0には基本・脅威・環境・補足の評価基準があります。"},
  {id:"mg-6", d:"mgmt", q:"NIST サイバーセキュリティフレームワーク（CSF）2.0で新たに追加された機能はどれか。", c:["統治（Govern）","識別（Identify）","防御（Protect）","復旧（Recover）"], e:"CSF 2.0は統治・識別・防御・検知・対応・復旧の6機能です。統治は経営層の関与や、サプライチェーンのリスク管理を扱います。"},
  {id:"mg-7", d:"mgmt", q:"登録情報処理安全確保支援士に法律で課されている義務はどれか。", c:["IPAなどが行う講習を、定められた期間ごとに受講する","毎年、情報処理技術者試験のいずれかの区分を受験する","勤務先にCSIRTを設置し、その責任者に就任する","業務で発見した脆弱性を、必ず自分の名前で公表する"], e:"講習の受講のほか、秘密保持義務と信用失墜行為の禁止があります。講習を受けないと、登録の取消しの対象になります。"},
  {id:"mg-8", d:"mgmt", q:"JIS Q 27001:2023（ISO/IEC 27001:2022）の附属書Aで、管理策を分類している4つのテーマはどれか。", c:["組織的・人的・物理的・技術的","計画・実行・点検・処置","識別・防御・検知・対応","機密性・完全性・可用性・真正性"], e:"2022年の改訂で、管理策は93個・4テーマに再編されました。計画・実行・点検・処置はPDCA、識別・防御・検知・対応はNIST CSFの機能の一部です。"},
  {id:"mg-9", d:"mgmt", q:"JIS Q 31000などでいうリスクアセスメントを構成するプロセスの組合せはどれか。", c:["リスク特定、リスク分析、リスク評価","リスク特定、リスク対応、リスク監視","リスク回避、リスク低減、リスク移転","脅威の分析、脆弱性の修正、事後の報告"], e:"リスクアセスメントの結果を受けて、回避・低減・移転・保有などのリスク対応を選びます。"},
  {id:"mg-10", d:"mgmt", q:"不正競争防止法で、営業秘密として保護されるための要件はどれか。", c:["秘密管理性、有用性、非公知性","秘密管理性、新規性、進歩性","機密性、完全性、可用性","非公知性、創作性、登録性"], e:"アクセス制限や「社外秘」の表示など、秘密として管理していることが必要です。新規性・進歩性は特許の要件です。"},
  {id:"mg-11", d:"mgmt", q:"刑法の不正指令電磁的記録に関する罪（いわゆるウイルス作成罪）の対象となる行為はどれか。", c:["正当な理由なく、他人のPCで実行させる目的でマルウェアを作成する","自社製品の脆弱性を調べるため、検証環境で攻撃ツールを動かす","マルウェアの解析レポートを読み、検知のためのルールを作成する","ウイルス対策ソフトの動作確認のため、テスト用のファイルを使う"], e:"「正当な理由がないのに」「人の電子計算機における実行の用に供する目的で」が要件です。作成のほか、提供や取得・保管も処罰の対象です。"},
  {id:"mg-12", d:"mgmt", q:"情報セキュリティ監査を行う監査人に求められる要件はどれか。", c:["監査対象から独立した立場で、客観的に判断できること","監査対象のシステムを、自ら設計・運用していること","監査対象の部署の責任者を、兼任していること","監査結果を、監査対象の部署の承認を得てから報告すること"], e:"外観上・精神上の独立性が求められます。自分が設計・運用したものを自分で監査すると、客観的な判断ができません。"},
  {id:"mg-13", d:"mgmt", q:"2025年4月に施行された改正で、プロバイダ責任制限法の名称は何に変わったか。", c:["情報流通プラットフォーム対処法","サイバーセキュリティ基本法","特定電子メール法","電子署名法"], e:"大規模なプラットフォーム事業者に、削除申出への対応の迅速化や運用状況の公表を義務付けました。"},
  {id:"mg-14", d:"mgmt", q:"サイバーセキュリティ経営ガイドラインで、経営者が認識すべきとされていることはどれか。", c:["取引先などを含むサプライチェーン全体の対策に目配りすること","セキュリティ対策は、すべて情報システム部門に任せること","インシデントの情報は、取引先や関係者には開示しないこと","対策の実施状況は、技術者の間だけで共有すること"], e:"経営者がリーダーシップをとること、サプライチェーン全体への目配り、平時と緊急時の社内外とのコミュニケーションの3原則が示されています。"},

  {id:"dv-1", d:"dev", q:"SBOMの説明として適切なものはどれか。", c:["ソフトウェアを構成するコンポーネントやライブラリと、そのバージョンの一覧","ソースコードを実行せずに解析し、脆弱性の原因になる記述を見つける手法","脆弱性の深刻度を、共通の基準で0.0〜10.0の数値に評価する仕組み","ソフトウェアの利用条件や再配布の可否を定めた、ライセンスの記載"], e:"新しい脆弱性が公表されたとき、影響を受ける製品をすばやく特定できます。ソースコードを実行せずに解析するのはSAST、深刻度の数値化はCVSSです。"},
  {id:"dv-2", d:"dev", q:"IaaSの責任共有モデルで、一般に利用者の責任となるものはどれか。", c:["仮想マシンのOSやミドルウェアへのセキュリティパッチの適用","データセンタの建物への入退室の管理と、監視カメラの運用","物理サーバのハードウェアが故障したときの部品の交換","仮想化基盤（ハイパーバイザ）に見つかった脆弱性の修正"], e:"IaaSではOSから上が利用者の責任です。PaaS・SaaSになるほど事業者の範囲が広がりますが、データとアクセス権限の管理はどの形態でも利用者の責任です。"},
  {id:"dv-3", d:"dev", q:"ファジングの説明として適切なものはどれか。", c:["予測しにくいデータを大量に入力し、異常な動作から脆弱性を見つける","ソースコードを複数人で読み合わせ、脆弱性につながる記述を見つける","過去に公表された脆弱性の一覧と、使っている製品の版数を照合する","本番環境の通信を監視し、攻撃と思われる入力を記録して分析する"], e:"クラッシュやメモリ破壊につながる入力処理の不備を、自動で見つけるのに有効です。"},
  {id:"dv-4", d:"dev", q:"SAST（静的アプリケーションセキュリティテスト）の説明はどれか。", c:["ソースコードを実行せずに解析し、脆弱性につながる記述を見つける","動作中のWebアプリに疑似的な攻撃を送り、応答から脆弱性を見つける","利用しているOSSのライブラリと版数を調べ、既知の脆弱性を見つける","本番環境の通信を監視し、Webアプリへの攻撃を検知して遮断する"], e:"疑似攻撃を送るのはDAST、OSSの既知の脆弱性を調べるのはSCA（ソフトウェア構成分析）、本番の通信を監視して遮断するのはWAFです。開発の早い段階で問題を見つける「シフトレフト」の手段です。"},
  {id:"dv-5", d:"dev", q:"クラウドのインスタンスメタデータサービスで、セッショントークンの取得を必須にする設定（IMDSv2など）の効果はどれか。", c:["SSRFで、インスタンスの一時的な認証情報を盗まれるリスクを下げる","インスタンス間の通信を暗号化し、同じネットワーク内での盗聴を防ぐ","メタデータの取得を高速にして、インスタンスの起動時間を短くする","メタデータを外部のネットワークからも参照できるようにして管理を楽にする"], e:"トークンの取得にはPUTリクエストと専用のヘッダが必要になり、単純なGETしか送れないSSRFでは認証情報を取り出しにくくなります。"},
  {id:"dv-6", d:"dev", q:"ソフトウェアサプライチェーン攻撃の例はどれか。", c:["開発元の配布環境に侵入し、正規の更新プログラムにマルウェアを混入する","組織の取引先になりすましたメールを送り、偽の請求書で代金を送金させる","Webサーバに大量のリクエストを送り、サービスを利用できない状態にする","偽の無線LANアクセスポイントを設置し、接続した端末の通信を盗聴する"], e:"正規の署名付きで配布されることもあり、利用者側では見抜きにくいのが特徴です。SBOMや配布物の完全性の検証が対策になります。"},
  {id:"dv-7", d:"dev", q:"次のC言語の処理で、脆弱性の原因になっている点はどれか。\nchar buf[16];\nstrcpy(buf, input);", c:["inputの長さを確認せず、16バイトの領域へコピーしている","bufを関数の中で宣言して、スタック上の領域に確保している","strcpyの戻り値を使わずに、そのまま捨てている","bufを初期化しないまま、コピー先の領域として使っている"], e:"入力が16バイト以上だと、隣接するメモリ（戻りアドレスなど）を上書きします（バッファオーバーフロー）。コピーする長さを制限できる関数を使い、長さを事前に確認します。"},
  {id:"dv-8", d:"dev", q:"ファイルのアクセス権を確認してから開くまでの間に、ファイルを別のものに差し替えられる脆弱性はどれか。", c:["TOCTOU（競合状態）","バッファオーバーフロー","整数オーバーフロー","解放後使用（use-after-free）"], e:"確認（Time of Check）と使用（Time of Use）の間のすき間を突きます。確認と使用を一度の操作で行うなどで対策します。"},
  {id:"dv-9", d:"dev", q:"解放後使用（use-after-free）の対策として適切なものはどれか。", c:["解放したポインタにNULLを代入し、解放済み領域の再利用を防ぐ","メモリを確保するときに、必要な大きさより多めに確保しておく","解放する前に、メモリの内容を別の領域にコピーしておく","同じメモリを2回以上解放して、確実に解放されるようにする"], e:"解放済みの領域を指すポインタ（ダングリングポインタ）を使うと、攻撃者に任意のコードを実行されることがあります。メモリ安全な言語を使うことも根本的な対策です。"},
  {id:"dv-10", d:"dev", q:"ソースコードにAPIキーを直接書いて、リポジトリに登録していたことが分かった。適切な対応はどれか。", c:["キーを無効化して再発行し、シークレット管理の仕組みから読み込む","リポジトリの最新版からキーを削除すれば、過去の履歴は対応しなくてよい","キーを別のファイルに移し、同じリポジトリに登録し直す","リポジトリを非公開にすれば、キーはそのまま使い続けてよい"], e:"履歴に残ったキーは取り出せるため、無効化が必須です。登録前にシークレットを検出するツールの導入も有効です。"},

  {id:"dv-12", d:"dev", q:"クラウドのIAMで、アプリケーションに長期のアクセスキーを持たせる代わりに推奨される方法はどれか。", c:["実行環境に割り当てたロールから、有効期限付きの一時的な認証情報を得る","管理者のアクセスキーを全アプリで共有し、定期的に手作業で更新する","アクセスキーをソースコードに埋め込み、難読化してから配布する","アクセスキーに全リソースへのフルアクセス権限を与え、設定ミスを防ぐ"], e:"一時的な認証情報なら、漏えいしても有効期限で使えなくなります。ロールに与える権限は最小限にします。"},
  {id:"dv-13", d:"dev", q:"脅威モデリングのSTRIDEで、「Repudiation（否認）」の脅威に対する対策はどれか。", c:["操作ログや電子署名で、誰が何をしたかを証明できるようにする","通信を暗号化して、内容を第三者に読まれないようにする","システムを冗長化して、障害時もサービスを継続できるようにする","入力値を検証して、データの改ざんを防ぐ"], e:"STRIDEは、なりすまし・改ざん・否認・情報漏えい・サービス妨害・権限昇格の頭文字です。"}

const WRITE = [
  {id:"w-1", d:"web", lim:40, s:"会員サイトの検索機能は、入力された検索語をそのまま結果画面に表示している。攻撃者が細工したURLを利用者に開かせる攻撃が確認された。", q:"この実装の脆弱性の名称と、利用者が受ける被害を述べよ。", a:"反射型XSS。罠URLを開くとスクリプトが実行され、Cookieを盗まれる。", k:[["XSS","クロスサイトスクリプティング","クロスサイト・スクリプティング"],["スクリプト","JAVASCRIPT","JS"],["COOKIE","クッキー","セッション","なりすま","偽の","偽画面","改ざん","窃取","盗","詐取","入力情報","フィッシング"]], note:"対策は出力時のエスケープです。HttpOnly属性やCSPは被害を小さくする保険的な対策として併記できると強いです。"},
  {id:"w-2", x:"SQLインジェクションです。入力値に「' OR '1'='1」のような文字列を入れられると、SQL文の構造そのものが書き換わり、パスワードを知らなくてもログインされたり、データベースの情報を盗まれたりします。", d:"web", lim:40, s:"ログイン処理で、利用者IDとパスワードの入力値を文字列連結してSQL文を組み立てていた。", q:"根本的な対策を述べよ。", a:"プレースホルダを用いてSQL文を組み立て、入力値を構文として解釈させない。", k:[["プレースホルダ","バインド","プリペアド"]], note:"エスケープ処理でも防げますが、漏れが生じやすいため、根本的な対策はプレースホルダ（静的プレースホルダが望ましい）です。"},
  {id:"w-3", d:"attack", lim:50, s:"ある会員サイトで不正ログインが多数発生した。ログイン失敗の件数は普段とほとんど変わらず、被害者のパスワードは十分な長さがあった。", q:"考えられる攻撃手法と、そう判断できる理由を述べよ。", a:"パスワードリスト攻撃。他サービスで漏えいした正しい組を使うので失敗が少ない。", k:[["パスワードリスト","リスト型","クレデンシャルスタッフィング","使い回"],["漏えい","漏洩","流出","他サービス","他のサービス","別のサービス"],["失敗が少な","成功率が高","正しい"]], note:"対策は多要素認証、リスクベース認証、漏えいしたパスワードとの照合など。利用者にはパスワードの使い回しをやめるよう周知します。"},
  {id:"w-4", d:"auth", lim:50, s:"インターネットバンキングにSMSのワンタイムパスワードを導入していたが、偽サイトを経由した不正ログインの被害が出た。", q:"SMSのワンタイムパスワードで防げなかった理由を述べよ。", a:"偽サイトが入力されたOTPを即座に正規サイトへ中継し、有効期間内にログインしたから。", k:[["中継","転送","リレー","リアルタイム","即座","直ちに","すぐ","その場で"],["偽サイト","フィッシング","中間者","攻撃者が"]], note:"FIDO2（WebAuthn）は署名がアクセス先のオリジンに結び付くため、偽サイトに中継されても使えません。"},
  {id:"w-5", d:"mail", lim:40, s:"SPFを設定している取引先からのメールが、社員が設定した外部への自動転送の転送先で、SPFの認証に失敗した。", q:"SPFの認証に失敗した理由を述べよ。", a:"転送サーバのIPアドレスが送信元ドメインのSPFレコードに含まれないから。", k:[["転送"],["含まれ","登録され","許可され","記載され","認可され","一致しな","対象外","認められ"]], note:"DKIMは本文とヘッダが変わらなければ転送後も検証に成功します。転送経路での認証結果を引き継ぐARCという仕組みもあります。"},
  {id:"w-6", x:"ランサムウェアは、感染した端末からネットワーク経由で書き込めるファイルを次々に暗号化します。常時つながっているNASのバックアップも同じように書き換えられるため、元のデータと一緒に暗号化されてしまいます。", d:"ir", lim:40, s:"ファイルサーバのバックアップを同じネットワーク上のNASに毎日取得していたが、ランサムウェアによってバックアップも暗号化された。", q:"バックアップの保管方法の改善策を述べよ。", a:"ネットワークから切り離した媒体や、変更できない領域に世代管理して保管する。", k:[["切り離","オフライン","隔離","分離","エアギャップ","別のネットワーク","別ネットワーク","到達できな"],["世代","変更できな","改ざんでき","書き換えでき","イミュータブル","WORM","オブジェクトロック","媒体","テープ","削除できな"]], note:"バックアップ用の認証情報を業務系と分けることや、復旧手順を定期的に訓練することも有効です。"},
  {id:"w-7", d:"ir", lim:40, s:"マルウェア感染が疑われるPCを見つけた担当者が、すぐに電源を切ろうとした。CSIRTは電源を切らずにLANケーブルを抜くよう指示した。", q:"電源を切らないよう指示した理由を述べよ。", a:"メモリ上の痕跡など、電源を切ると失われる証拠を保全するため。", k:[["メモリ","揮発","RAM","プロセス","通信状況","接続状況"],["証拠","痕跡","調査","解析"],["失われ","消え","保全","残す","残るよう"]], note:"LANケーブルを抜くのは、感染の拡大と外部との通信を止めるためです。無線LANの切断も忘れないようにします。"},
  {id:"w-8", d:"net", lim:50, s:"社内から外部への通信をプロキシ経由のHTTP/HTTPSだけに制限していたが、マルウェアが社内DNSサーバを経由して外部のサーバとデータをやり取りしていた。", q:"この通信が可能だった理由を述べよ。", a:"社内DNSサーバが外部への名前解決を中継し、問合せの名前にデータを埋め込めたから。", k:[["DNS"],["名前解決","問合せ","問い合わせ","クエリ"],["埋め込","トンネ","符号化","エンコード","サブドメイン","乗せ"]], note:"DNSトンネリングと呼ばれます。長いサブドメインや大量の問合せの監視、外部の名前を解決できる端末を限定するなどで対策します。"},
  {id:"w-9", x:"CSRF（クロスサイトリクエストフォージェリ）です。罠サイトが会員情報変更のフォームを自動で送信させると、ブラウザはログイン中のセッションのCookieを自動で付けて送ります。サーバは本人の操作と区別できず、変更を受け付けてしまいます。", d:"web", lim:50, s:"会員情報の変更画面で、ログイン中の利用者が罠サイトを閲覧しただけで、登録メールアドレスが攻撃者のものに変更された。", q:"この攻撃への対策を述べよ。", a:"推測困難なトークンをフォームに埋め込み、送信時にセッションと照合する。", k:[["トークン"],["照合","検証","比較","チェック"]], alt:[[["SAMESITE"]],[["再入力","再認証","パスワードを入力","パスワードの入力"]]], note:"トークンによる照合のほか、CookieのSameSite属性（LaxやStrict）や、重要な操作の前のパスワード再入力も対策として成立します。"},
  {id:"w-10", d:"dev", lim:40, s:"クラウド上のWebアプリに、利用者が指定したURLから画像を取得する機能があった。攻撃者はURLにインスタンスメタデータサービスのアドレスを指定した。", q:"攻撃者の目的を述べよ。", a:"一時的な認証情報を取得し、クラウドの資源を不正に操作するため。", k:[["認証情報","クレデンシャル","アクセスキー","トークン","IAMロール","ロールの"],["不正","操作","悪用","窃取","盗","奪"]], note:"SSRFです。取得先の許可リスト化、IMDSv2の強制、インスタンスに付ける権限の最小化で対策します。"},
  {id:"w-11", x:"秘密鍵が漏れると、攻撃者はその証明書を使って正規のサーバになりすましたり、通信の間に入って内容を盗み見たりできます。リポジトリから消しても、すでに誰かが複製した可能性があるため、その鍵ペアはもう使えないものとして扱います。", d:"crypto", lim:40, s:"Webサーバ証明書の秘密鍵を含む設定ファイルを、誤って公開リポジトリに登録してしまった。", q:"証明書についてとるべき対応を述べよ。", a:"証明書を失効させ、新しい鍵ペアを生成して証明書を再発行する。", k:[["失効","リボーク","無効"],["再発行","新しい鍵","新たな鍵","鍵ペアを再","作り直","再生成"]], note:"同じ鍵ペアでCSRを作り直しても意味がありません。リポジトリの履歴から削除するだけでは不十分です。"},
  {id:"w-12", d:"mgmt", lim:40, s:"インシデント調査でファイアウォール、プロキシ、サーバのログを突き合わせたところ、出来事の前後関係が判断できなかった。", q:"判断できなかった原因と対策を述べよ。", a:"機器の時刻がずれていた。NTPで全機器の時刻を同期する。", k:[["時刻","クロック","時計"],["ずれ","ズレ","不一致","合っていな","同期されていな","異な"],["NTP","同期"]], note:"ログを集中管理するSIEMを使う場合も、各機器の時刻同期とタイムゾーンの統一が前提になります。"},
  {id:"w-13", d:"auth", lim:40, s:"OAuth 2.0の認可サーバが、クライアントの登録済みリダイレクトURIとの照合を前方一致で行っていた。", q:"この実装で起きうる攻撃を述べよ。", a:"攻撃者のURLへリダイレクトさせ、認可コードを横取りされる。", k:[["認可コード","アクセストークン","トークン"],["横取り","窃取","盗","奪","漏え","攻撃者"]], note:"リダイレクトURIは完全一致で照合します。認可コードの横取りにはPKCEも有効です。"},
  {id:"w-14", d:"net", lim:40, s:"社外からの保守のため、ファイアウォールでサーバのリモートデスクトップ（TCP 3389）をインターネットに公開していた。", q:"このまま運用するリスクを述べよ。", a:"パスワードの推測や脆弱性の悪用で、サーバに不正ログインされる。", k:[["パスワード","総当たり","推測","ブルートフォース","脆弱性","認証情報"],["不正ログイン","侵入","乗っ取","不正アクセス","不正に接続","ランサムウェア"]], note:"VPN経由に限定し多要素認証を使う、接続元のIPアドレスを制限するなどで対策します。ランサムウェアの侵入口として多く悪用されています。"},
  {id:"w-15", d:"web", lim:40, s:"Webアプリが、セッションIDをURLのパラメータに含めていた。ページ内には外部サイトへのリンクがある。", q:"セッションIDが漏えいする経路を述べよ。", a:"外部サイトへのリンクをたどると、RefererヘッダでURLごと送られる。", k:[["REFERER","リファラ"],["外部","別のサイト","リンク先","他のサイト"]], note:"セッションIDはCookieで管理するのが基本です。Referrer-Policyで送るURLを制限することもできます。"},
  {id:"w-16", d:"mail", lim:40, s:"取引先を装ったメールで振込先口座の変更を依頼され、経理担当者が送金してしまった。メールは取引先の担当者との過去のやり取りを引用していた。", q:"このメールを本物らしく見せられた理由として考えられることを述べよ。", a:"取引先のメールアカウントが侵害され、過去のメールを盗み見られていたから。", k:[["取引先","相手"],["侵害","乗っ取","不正ログイン","感染","盗み見","窃取","漏え"]], note:"ビジネスメール詐欺（BEC）です。振込先の変更は、電話など別の経路で確認するルールにします。"},
  {id:"w-17", d:"ir", lim:40, s:"EDRの検知で、ある端末が深夜に社内の複数のサーバへ管理共有（SMB）で接続していたことが分かった。", q:"攻撃者がこの段階で行っていると考えられることを述べよ。", a:"侵入した端末を足がかりに、他のサーバへ侵害を広げる横展開を行っている。", k:[["横展開","ラテラル","侵害を広げ","感染を広げ","感染拡大","探索","偵察"]], note:"窃取した認証情報が使われていることが多いため、管理者アカウントの分離や端末間の通信制限が対策になります。"},
  {id:"w-18", d:"crypto", lim:50, s:"社内システムで、利用者のパスワードをSHA-256でハッシュ化して保存していた（ソルトなし）。このデータベースが漏えいした。", q:"この保存方法の問題点を述べよ。", a:"ソルトがなく高速なハッシュのため、事前計算表や総当たりで元のパスワードを短時間で求められる。", k:[["ソルト"],["事前計算","レインボー","総当たり","辞書","ブルートフォース"]], note:"ソルトに加えて、bcryptやArgon2などの計算に時間がかかる方式（ストレッチング）を使います。"},
  {id:"w-19", d:"dev", lim:40, s:"ファイルのダウンロード機能で、ファイル名をパラメータで受け取り、公開用ディレクトリのパスと連結してファイルを開いていた。", q:"攻撃者が悪用する方法を述べよ。", a:"../を含むファイル名を指定し、公開用ディレクトリ外のファイルを読み出す。", k:[["../","..\\","上位","親ディレクトリ","トラバーサル"],["外","任意","設定ファイル","パスワードファイル","/ETC"]], note:"ディレクトリトラバーサルです。ファイル名を直接指定させない設計にするか、ファイル名からディレクトリ部分を取り除きます。"},
  {id:"w-20", d:"net", lim:40, s:"無線LANの暗号化にWPA2-Personalを使い、全社員が同じパスフレーズを使っていた。退職者が出た。", q:"このままでは生じるリスクを述べよ。", a:"退職者が知るパスフレーズで接続でき、社内LANに不正にアクセスされる。", k:[["退職者","元社員","知って","知る"],["接続","アクセス","侵入","盗聴","復号"]], note:"IEEE 802.1X（EAP-TLSなど）で利用者や端末ごとに認証すれば、個別に無効化できます。"},
  {id:"w-21", x:"パッチは、OSやミドルウェアの動作を変えるため、業務アプリが動かなくなることがあります。検証せずに本番環境へ適用すると、業務システムが止まるなどの障害につながります。", d:"mgmt", lim:40, s:"ある脆弱性について、ベンダから修正パッチが公開された。担当者はパッチをすぐに本番環境へ適用しようとした。", q:"適用前に行うべきことを述べよ。", a:"検証環境で業務アプリへの影響を確認し、切り戻し手順を準備する。", k:[["検証","テスト","試験"],["影響","動作","不具合"],["切り戻","ロールバック","バックアップ","戻す"]], note:"深刻度（CVSS）や悪用の状況で適用の緊急度を判断し、すぐに適用できない場合は回避策で被害を防ぎます。"},

function allocate(days, ratios) {
  const n = ratios.length;
  const sum = ratios.reduce((a, b) => a + b, 0);
  const extra = days - n;
  const raw = ratios.map(r => extra * r / sum);
  const out = raw.map(x => 1 + Math.floor(x));
  let left = days - out.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { out[i]++; left--; } });
  return out;
}

function buildPlan(p) {
  const t = todayStr();
  const left = diff(t, p.exam);
  if (left <= 0) return { done: left < 0, today: left === 0, days: left, phases: [] };
  const start = p.start <= t ? p.start : t;
  const phases = [];
  const seg = (from, to, keys, ratios) => {
    let days = diff(from, to);
    if (days <= 0) return;
    if (days < keys.length) { keys = keys.slice(-days); ratios = ratios.slice(-days); }
    const lens = allocate(days, ratios);
    let cur = from;
    keys.forEach((k, i) => { const f = cur; cur = addDays(cur, lens[i]); phases.push({ key: k, from: f, to: addDays(cur, -1) }); });
  };
  const total = diff(start, p.exam);
  const exr = { none: .3, some: .25, pro: .18 }[p.exp] || .25;
  if (total <= 3) seg(start, p.exam, ["sprint"], [1]);
  else if (p.target === "r8b" || (p.target === "late" && (!p.aDate || p.aDate < start))) seg(start, p.exam, ["b", "last"], [.7, .3]);
  else if (p.target === "late") {
    const acStart = maxD(start, addDays(p.aDate, -10));
    const pre = diff(start, acStart);
    if (pre >= 35) seg(start, acStart, ["base", "deep", "b"], [exr, .3, .3]);
    else if (pre >= 6) seg(start, acStart, ["base", "b"], [.5, .5]);
    else seg(start, acStart, ["base"], [1]);
    phases.push({ key: "acheck", from: acStart, to: p.aDate });
    const after = addDays(p.aDate, 1);
    const post = diff(after, p.exam);
    if (post >= 8) seg(after, p.exam, ["b2", "last"], [.6, .4]);
    else seg(after, p.exam, ["last"], [1]);
  }
  else if (total < 35) seg(start, p.exam, ["base", "b", "last"], [.3, .5, .2]);
  else seg(start, p.exam, ["base", "deep", "b", "last"], [exr, .27, .33, .12]);
  phases.forEach(ph => Object.assign(ph, phaseInfo(ph.key, p), { tasks: tasksFor(ph.key, p) }));
  const hpw = p.hours;
  const weekday = Math.min(Math.round(hpw * 60 * .4 / 5 / 30) * 30, Math.floor(hpw * 60 / 5 / 30) * 30);
  const weekend = (hpw * 60 - weekday * 5) / 2;
  return { days: left, total: Math.round(left / 7 * hpw), weekday, weekend, phases };
}

/* 4択の出題順。間隔をあけてくり返す（間違えた問題は翌日、正解するたびに3日→7日→14日→30日後）。
   直近に解いた問題は後回しにし、まだ解いていない問題と、復習の時期が来た問題を先に出す */
const QGAP = [1, 3, 7, 14, 30];
function quizPriority(q, t) {
  const r = S.qt[q.id];
  if (!r) return q.id in S.last ? (S.last[q.id] ? 2 : 4) : 3;   // 日付の記録がない問題
  if (r.t === t) return -6;                                       // 今日解いた
  const due = addDays(r.t, QGAP[r.r]);
  return due <= t ? 3.5 + Math.min(diff(due, t), 30) * .03 - r.r * .2 : -3 + diff(t, due) * -.1;
}
function pickQuiz(n, domain, ids, mix) {
  const t = todayStr();
  const weak = new Set(S.profile ? S.profile.weak : []);
  const rank = list => list.map(q => {
    const st = S.stats[q.d], rate = st && st.n ? st.c / st.n : .5;
    return { q, s: quizPriority(q, t) + (weak.has(q.d) ? .8 : 0) + (rate < .6 ? .4 : 0) + Math.random() * 1.2 };
  }).sort((a, b) => b.s - a.s).map(x => x.q);
  const base = QUIZ.filter(q => !ids || ids.includes(q.id));
  // おすすめ：苦手分野から半分強、残りはほかの分野から
  if (mix && domain) {
    const k = Math.ceil(n / 2);
    const a = rank(base.filter(q => q.d === domain)).slice(0, k);
    const b = rank(base.filter(q => q.d !== domain)).slice(0, n - a.length);
    return shuffle(a.concat(b));
  }
  return rank(base.filter(q => !domain || q.d === domain)).slice(0, n);
}
/* o.today: 今日の学習から / o.one: 1問だけ / o.box: 10分だけ / o.resume: 続きから */
async function runQuiz(n, domain, ids, o = {}) {
  let sess = o.resume;
  actStart();
  if (sess) await coach("<p>続きから再開します。あと" + (sess.ids.length - sess.i) + "問です。</p>", 250);
  else {
    const qs0 = pickQuiz(n, domain, ids, o.mix);
    sess = { k: "quiz", ids: qs0.map(q => q.id), i: 0, ok: 0, today: !!o.today, box: !!o.box };
    if (!o.today) await coach("<p>" + (o.one ? "4択を1問だけいきます。" : o.box ? "10分だけ、4択を解きます。10分たったらお知らせします。" : ids ? "復習リストの問題を" + qs0.length + "問いきます。" : "科目A-2（旧午前II）形式の4択を" + qs0.length + "問いきます（約" + qs0.length + "分）。") + '</p><p class="small kbonly">キーボードなら1〜4キーでも答えられます。</p>', 350);
  }

    await coach('<span class="tag">Q' + (i+1) + (sess.box ? "" : "/" + qs.length) + '</span><p class="qtext">' + esc(q.q) + "</p>", i > start ? 250 : 450);
    const pick = await ask(order.map(o => ({ label: o.t, value: o.k })), { wide: true, lead: "答えを選んでください", extra: [{ label: "やめる", value: -1 }] });
    if (pick === -1) { quit = true; break; }
    const right = pick === 0;
    sess.i = i + 1; if (right) sess.ok++;
    const st = S.stats[q.d] || (S.stats[q.d] = { c: 0, n: 0 });
    st.n++; if (right) st.c++;
    S.last[q.id] = right;
    const pr = S.qt[q.id];
    S.qt[q.id] = { r: right ? (pr && pr.t !== todayStr() ? Math.min(pr.r + 1, 4) : pr ? pr.r : 1) : 0, t: todayStr() };
    logAct(1);
    if (sess.i >= qs.length) S.sess = null;
    save();
    const ansKana = KANA[order.findIndex(o => o.k === 0)], mineKana = KANA[order.findIndex(o => o.k === pick)];
    await coach('<span class="tag">' + esc(DOMAINS[q.d]) + "</span>" +
      (right ? '<p><span class="ok">✓ 正解</span>　' + ansKana + "　" + esc(q.c[0]) + "</p>"
             : '<p><span class="ng">✕ 不正解</span></p><ul><li>あなたの解答：' + mineKana + "　" + esc(q.c[pick]) + "</li><li><strong>正解：" + ansKana + "　" + esc(q.c[0]) + "</strong></li></ul>") +
      explainHTML(q.e, q.id, [q.q].concat(q.c, [q.e])), 250);
    if (i < qs.length - 1) {
      if (boxAsk && Date.now() - t0 >= 10 * 60000) {
        const more = await ask([{ label: "ここで終える", value: false, primary: true }], { lead: "10分たちました。おつかれさまです", extra: [{ label: "もう少し続ける", value: true }] });
        if (!more) { boxEnd = true; break; }
        boxAsk = false;
      } else {
        const go = await ask([{ label: "次の問題", value: true, primary: true }], { extra: [{ label: "ここでやめる", value: false }] });
        if (!go) { quit = true; break; }

  if (!done) { await coach("<p>中断しました。メニューに戻ります。</p>", 200); return { n: 0, ok: 0, quit: true }; }
  if (o.one) return { n: done, ok, quit: false };
  const rate = Math.round(ok / done * 100);
  let msg = ok === 0 ? done + "問チャレンジしました。解説を読んだ分だけ、確実に前に進んでいます。"
    : done + "問解きました（そのうち" + ok + "問正解）。" + (done >= 10 ? (rate >= 80 ? "科目A-2の合格ラインを十分に越えています。" : rate >= 60 ? "合格ラインの60%を越えています。" : "") : "");

  if (keep) msg += "続きは、メニューの一番上の「続きから」で再開できます。";
  await coach("<p>" + msg + "</p>" + (o.today ? "" : rewardHTML()));

}

    const hl = () => { h.textContent = run.hide ? "時間を表示" : "時間を隠す"; h.setAttribute("aria-pressed", run.hide ? "true" : "false"); };

  document.getElementById("rl").onclick = () => location.reload();
  document.getElementById("wipe").onclick = () => { try { localStorage.removeItem(KEY); } catch (_) {} location.reload(); };
});
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body></html>
