<title>ネスペ合格コーチ</title>

<style>
/* Layout: 1カラムのチャット。上にリンクLED付きヘッダ、下に返答ドック。LANケーブルの青をアクセントに */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --coach: #E5EDF4;
  --ink: #15212B;
  --muted: #55636F;
  --line: #D3DCE3;
  --edge: #7D8E9B;
  --track: #D3DCE3;
  --accent: #1F6FB2;
  --accent-hi: #185C95;
  --accent-ink: #FFFFFF;
  --led: #2E9E4C;
  --ok: #1D7536;
  --amber: #B97A0C;
  --bad: #B3362F;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16212A; --coach: #1A2A37; --ink: #E2E9EF; --muted: #97A8B6;
    --line: #2A3A47; --edge: #6E8597; --track: #22313D; --accent: #5BA7E9; --accent-hi: #8CC3F2; --accent-ink: #08131C;
    --led: #47C46B; --ok: #5ED07F; --amber: #E7B23F; --bad: #EE7A73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16212A; --coach: #1A2A37; --ink: #E2E9EF; --muted: #97A8B6;
  --line: #2A3A47; --edge: #6E8597; --track: #22313D; --accent: #5BA7E9; --accent-hi: #8CC3F2; --accent-ink: #08131C;
  --led: #47C46B; --ok: #5ED07F; --amber: #E7B23F; --bad: #EE7A73;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; }
/* 画面全体は動かさず、会話欄（main）だけをスクロールさせる。アプリ内の表示でも自動スクロールが効くようにするため */
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75;
  height: 100%; display: flex; flex-direction: column; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 720px; margin: 0 auto; }
a { color: var(--accent); }

header { flex: none; position: relative; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header .col { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: .02em; white-space: nowrap; min-width: 0; }
.port { width: 30px; height: 24px; border: 2px solid var(--ink); border-radius: 3px; position: relative; flex: none; }
.port::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: -2px; height: 6px; background: var(--surface); border: 2px solid var(--ink); border-bottom: 0; }
.port i { position: absolute; top: 3px; width: 5px; height: 4px; border-radius: 1px; }
.port i:first-child { left: 3px; background: var(--led); }
.port i:last-child { right: 3px; background: var(--amber); }
.status { margin-left: auto; font-family: var(--f-mono); font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: nowrap; justify-content: flex-end; min-width: 0; }
.status > span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }

main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-block: 20px 12px; }
#log { display: flex; flex-direction: column; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; scroll-margin-top: 72px; }
.msg.me { justify-content: flex-end; }
.av { flex: none; width: 34px; height: 34px; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--f-mono); font-size: 11px; display: grid; place-items: center; letter-spacing: .04em; }
.bub { min-width: 0; max-width: min(600px, 88%); padding: 10px 14px; border-radius: 4px 14px 14px 14px; background: var(--coach); overflow-wrap: anywhere; }
.me .bub { background: var(--accent); color: var(--accent-ink); border-radius: 14px 4px 14px 14px; }
.bub p { margin: 0; }
.bub > * + * { margin-top: 8px; }
.bub ul { margin-bottom: 0; padding-left: 1.2em; }
.bub strong { font-weight: 700; }
.qtext { white-space: pre-wrap; }
.tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; color: var(--muted); }
.ok { color: var(--ok); font-weight: 700; }
.ng { color: var(--bad); font-weight: 700; }
.na { color: var(--muted); font-weight: 700; }
.small { font-size: 13px; color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card.warn { border-color: var(--amber); }
.phase { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding-block: 10px; }
.phase + .phase { border-top: 1px dashed var(--line); }
.phase:first-child { padding-top: 2px; }
.phase .n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 3px; }
.phase h4 { margin: 0; font-size: 15px; text-wrap: balance; }
.phase .d { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.phase ul { grid-column: 2; margin-top: 4px; }
.phase .pill { font-size: 11px; font-weight: 500; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); vertical-align: 2px; white-space: nowrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; min-width: 0; }
.bar { display: grid; grid-template-columns: 10.5em 1fr 6.5em; align-items: center; gap: 8px; font-size: 13px; }
.bar + .bar { margin-top: 6px; }
.bar .t { height: 10px; background: var(--track); border: 1px solid var(--edge); border-radius: 5px; overflow: hidden; }
.bar .t b { display: block; height: 100%; background: var(--accent); }
.bar .t b.low { background: var(--bad); }
.bar .v { font-family: var(--f-mono); font-size: 12px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.answer { border-left: 3px solid var(--led); padding-left: 10px; }
/* IPAの過去問の画像。紙面の画像なので、どちらのテーマでも白地のまま表示する */
.pq { margin: 0; }
.pq img { display: block; width: 100%; height: auto; background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; }
.pq figcaption { margin-top: 4px; }
.zoom { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 8px; background: rgba(8, 12, 16, .88);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.zoom .zclose { align-self: flex-end; }
.zoom .zwrap { flex: 1; min-height: 0; overflow: auto; background: #FFFFFF; border-radius: 6px; }
.zoom .zwrap img { display: block; max-width: none; width: auto; }
/* 解説の図解（SVG）。色はテーマの色を使う */
.fig { margin: 0; }
.fig svg { display: block; width: 100%; max-width: 480px; height: auto; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.fig text { fill: var(--ink); font-family: var(--f-body); font-size: 11px; }
.fig .lbl, .fig .note { font-size: 10px; }
.fig .lbl { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.fig .note { fill: var(--muted); }
.fig .box { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.fig .box.ok { stroke: var(--ok); stroke-width: 2; }
.fig .box.bad { stroke: var(--bad); stroke-width: 2; }
.fig .ln { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.fig .ln.ok { stroke: var(--ok); }
.fig .ln.bad { stroke: var(--bad); }
.fig .ln.dash { stroke-dasharray: 4 3; }
.fig .life { stroke: var(--edge); stroke-dasharray: 3 3; }
.fig .ah, .fig .dot { fill: var(--ink); }
.fig .dot.ok { fill: var(--ok); } .fig .dot.bad { fill: var(--bad); }
/* 略語の正式名称 */
.abbr summary { cursor: pointer; font-size: 13px; color: var(--accent); }
.abbr dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; font-size: 13px; }
.abbr dt { font-family: var(--f-mono); font-weight: 500; }
.abbr dd { margin: 0; min-width: 0; }
.abbr dd span { display: block; color: var(--muted); font-size: 12px; }
/* 折りたたみ（くわしく・試験の詳細） */
details.more { margin-top: 6px; }
details.more > summary { cursor: pointer; font-size: 13px; color: var(--accent); }
details.more[open] > summary { margin-bottom: 6px; }
.mt { margin-top: 6px; }
/* この7日間のカレンダー */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; text-align: center; font-family: var(--f-mono); }
.week span { border: 1px solid var(--line); border-radius: 6px; padding: 2px 0; color: var(--muted); font-size: 14px; line-height: 1.3; }
.week span small { display: block; font-size: 10px; }
.week span.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.week span.today { box-shadow: inset 0 -3px 0 var(--edge); }
/* 過去問の本番形式：採点前の見直し */
.ansgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; margin-top: 6px; font-family: var(--f-mono); font-size: 14px; }
.ansgrid span { border: 1px solid var(--line); border-radius: 4px; text-align: center; padding: 1px 0; }
.ansgrid b { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
.dock .col.grid6 { display: grid; grid-template-columns: repeat(5, 1fr); align-items: stretch; }
.dock .col.grid6 > .lead, .dock .col.grid6 > .row, .dock .col.grid6 > .hint { grid-column: 1 / -1; }
.dock .col.grid6 > .opt { text-align: center; padding: 6px 2px; min-height: 40px; font-size: 13px; font-family: var(--f-mono); }
.pmdock .row > .sep { flex: 0 0 10px; }
/* タッチ端末では、キーボード操作の案内を出さない */
@media (hover: none) { .kbonly { display: none; } }
/* 午後のページ画像。PCやタブレットはページ全体、スマホは本文を折り返したかたまりで表示する */
.pg + .pg { margin-top: 10px; }
.pg img { display: block; max-width: 100%; height: auto; cursor: zoom-in; }
.pg-wide img { width: 100%; background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; }
.pg-narrow { display: none; background: #FFFFFF; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.pg-narrow .pb + .pb { margin-top: 4px; }
@media (max-width: 640px) { .pg-wide { display: none; } .pg-narrow { display: block; } }
.dock .col.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); align-items: stretch; }
.dock .col.pmdock { gap: 6px; padding-block: 8px; }
.pmdock .row { flex-wrap: nowrap; gap: 6px; }
.pmdock .row > .opt { flex: 1; text-align: center; padding: 6px 8px; min-height: 40px; white-space: nowrap; }
.pmdock .lead { font-variant-numeric: tabular-nums; }
.dock .col.grid4 > .lead, .dock .col.grid4 > .row { grid-column: 1 / -1; }
.dock .col.grid4 > .opt { text-align: center; font-size: 18px; font-weight: 700; min-height: 52px; }
.fig .cap { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table.t { border-collapse: collapse; font-size: 13px; width: 100%; font-variant-numeric: tabular-nums; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: left; white-space: nowrap; }
table.t th { color: var(--muted); font-weight: 500; }
table.t tr:last-child td { border-bottom: 0; }
pre.log { margin: 0; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.6; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: pre; overflow-wrap: normal; }

.dock { flex: none; position: relative; z-index: 4; background: var(--bg); border-top: 1px solid var(--line); }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
  .dock { background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
}
.dock .col { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; min-height: 60px; align-items: center; outline: none; max-height: 52vh; max-height: 52dvh; overflow-y: auto; }
.dock .col.grid2 { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; }
.dock .col.grid2 > .lead, .dock .col.grid2 > .full { grid-column: 1 / -1; }
.dock .hint { width: 100%; font-size: 12px; color: var(--muted); margin: -2px 0 0; }
.dock .hint.err { color: var(--bad); font-weight: 700; }
.dock .lead { width: 100%; font-size: 13px; color: var(--muted); margin: 0; }
.dock .lead.q { color: var(--ink); font-size: 14px; max-height: 4.8em; overflow-y: auto; border-left: 3px solid var(--accent); padding-left: 8px; }
button { font: inherit; cursor: pointer; }
.opt { border: 1px solid var(--accent); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; text-align: left; line-height: 1.5; max-width: 100%; min-height: 44px; }
.opt.primary { background: var(--accent); color: var(--accent-ink); }
.opt.wide { width: 100%; display: grid; grid-template-columns: 1.8em 1fr; gap: 4px; }
.opt .k { font-weight: 700; color: var(--accent); }
.opt.on { background: var(--accent); color: var(--accent-ink); }
.opt.on .k { color: inherit; }
.opt.quiet { border-color: var(--edge); color: var(--muted); }
.opt.danger { border-color: var(--bad); color: var(--bad); }
@media (hover: hover) {
  .opt:hover { background: var(--coach); }
  .opt.primary:hover, .opt.on:hover { background: var(--accent-hi); }
}
.row { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; margin-top: 6px; }
.row .grow { flex: 1; }
.row input { flex: 1; min-width: 0; }
.row input[type="number"] { flex: 0 1 7em; }
.row .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.row .count.over { color: var(--bad); font-weight: 700; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
textarea, input[type="date"], input[type="number"] { font: inherit; font-size: 16px; width: 100%; border: 1px solid var(--edge); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 76px; resize: vertical; }
textarea[aria-invalid="true"], input[aria-invalid="true"] { border-color: var(--bad); }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: .2; } }
body.kb .status, body.kb .dock .hint { display: none; }
body.kb .dock .col { max-height: 60vh; }
@media (prefers-reduced-motion: reduce) { .port i:first-child, .typing i { animation: none; } }
@media (max-width: 480px) {
  .bub { max-width: 100%; } .av { display: none; }
  .bar { grid-template-columns: 1fr 6.5em; } .bar .t { grid-column: 1 / -1; grid-row: 2; }
  .brand { font-size: 15px; gap: 8px; }
  .status { font-size: 11px; gap: 4px; } .status > span { padding: 1px 6px; } .status .ph-name { display: none; }
}
@media (max-width: 380px) { .status .acc { display: none; } }
</style>

<header class="gut"><div class="col">
  <div class="brand"><span class="port" aria-hidden="true"><i></i><i></i></span>ネスペ合格コーチ</div>

</div></header>

<main class="gut"><div class="col"><div id="log" role="log" aria-label="コーチとの会話"></div></div></main>

<div class="dock gut"><div class="col" id="dock" tabindex="-1" role="group" aria-label="返答"></div></div>
<script>
/* ===== 試験情報（IPA公式サイトの掲載内容を 2026-11-11 時点で確認して記載） ===== */
const EXAM = {

    b: "2026/11/11（水）〜 11/23（月・祝）", bStart: "2026-11-11", bEnd: "2026-11-23",
    note: "受験日時は期間内で各自が予約します。予約内容はIPAのマイページで確認してください。"

const DOMAINS = {
  l2:    "L2・VLAN・STP",
  ip:    "IP・IPv6・サブネット",
  route: "ルーティング",

  {id:"rt-1", d:"route", q:"OSPFが経路選択に用いるメトリックはどれか。", c:["帯域幅などから決めるインタフェースごとのコスト","経由するルータの数（ホップ数）で、最大15まで数える","隣接ASから受け取ったAS_PATH属性の長さ","帯域・遅延・負荷・信頼性を組み合わせた複合値"], e:"OSPFはリンクステート型で、経路上のコストの合計が最小の経路を選びます。多くの実装では基準帯域÷インタフェース帯域を既定値にしています。ホップ数を使うのはRIPです。"},
  {id:"rt-2", d:"route", q:"ルーティングテーブルに 10.0.0.0/8、10.1.0.0/16、10.1.1.0/24、0.0.0.0/0 の4経路があるとき、宛先10.1.1.5のパケットに使われる経路はどれか。", c:["10.1.1.0/24","10.1.0.0/16","10.0.0.0/8","0.0.0.0/0"], e:"ロンゲストマッチ。宛先に一致する経路のうち、プレフィックス長が最も長いものが選ばれます。"},
  {id:"rt-3", d:"route", q:"BGPの説明として適切なものはどれか。", c:["AS間の経路交換に使うパスベクタ型のプロトコルで、TCP 179番を使う","AS内部で使うリンクステート型のプロトコルで、IPプロトコル番号89を使う","ホップ数を最大15とする距離ベクタ型のプロトコルで、UDP 520番を使う","レイヤ2でループを防止するプロトコルで、BPDUを交換する"], e:"BGPはTCPで接続を張り、AS_PATHなどのパス属性で経路を選択・ループ検出します。プロトコル番号89で動くのはOSPFです。"},
  {id:"rt-4", d:"route", q:"OSPFのエリア設計で正しいものはどれか。", c:["エリア0以外のエリアはエリア0に接続しなければならない","各エリアは、エリア0を介さず互いに直接接続しなければならない","エリア0には、1台のルータしか所属させることができない","エリア境界ルータは、1つのエリアにだけ所属しなければならない"], e:"エリア0はバックボーンエリア。他エリアは必ずエリア0と接続します（物理的に無理なら仮想リンク）。ABRは複数エリアに所属します。"},
  {id:"rt-5", d:"route", q:"OSPFでDR（指定ルータ）を選出する目的はどれか。", c:["マルチアクセス網での隣接関係とLSAの交換を減らすため","AS外部から学習した経路をOSPF内へ再配布するため","等コストの複数経路で負荷を分散させるため","隣接ルータ間でやり取りする経路情報を認証するため"], e:"全ルータが互いに隣接関係を結ぶと数が増えすぎるため、DR/BDRとだけ完全隣接になります。優先度が最大、同値ならルータIDが最大のルータが選ばれます。DRはプリエンプトしないので、後から優先度の高いルータが参加しても交代しません。"},
  {id:"rt-6", d:"route", q:"BGPで受信した経路のAS_PATHに自ASの番号が含まれていたときの動作はどれか。", c:["ループと判断して経路を採用しない","最も優先度の高い経路として採用する","AS_PATHから自ASを削除して採用する","経路を全ピアへそのまま広告する"], e:"AS_PATHはループ検出に使われます。経路選択では、他の条件が同じならAS_PATHが短い経路が優先されます。"},
  {id:"rt-7", d:"route", q:"BGPのLOCAL_PREF属性の説明として適切なものはどれか。", c:["AS内で共有され、値が大きい経路ほど優先される。自ASの出口の選択に使う","AS間で伝搬され、値が小さい経路ほど優先される。隣接ASからの入口の選択に使う","自ASの番号を繰り返し付加して経路を長く見せ、受信側の経路選択を誘導する","経路の生成元がIGP・EGP・不明のどれかを示し、経路選択の判断材料になる"], e:"出口（アウトバウンド）の制御はLOCAL_PREF、入口（インバウンド）の制御はMEDやAS_PATHプリペンドが定番です。2本のISP回線の使い分けで頻出です。"},

  {id:"tcp-1", d:"tcp", q:"TCPの3ウェイハンドシェイクの順序として正しいものはどれか。", c:["SYN → SYN/ACK → ACK","SYN → ACK → SYN/ACK","SYN/ACK → SYN → ACK","ACK → SYN → SYN/ACK"], e:"クライアントのSYN、サーバのSYN/ACK、クライアントのACKで接続が確立します。"},
  {id:"tcp-2", d:"tcp", q:"ウィンドウサイズ64Kバイト、RTT10ミリ秒のTCP通信で、理論上の最大スループットに最も近いものはどれか（ウィンドウスケールなし）。", c:["約52Mビット/秒","約5Mビット/秒","約520Mビット/秒","約6.4Mビット/秒"], e:"1RTTで送れるのは最大ウィンドウ分。65,535バイト×8÷0.01秒≒52Mビット/秒です。回線が1Gビット/秒でもこれが上限になります。"},
  {id:"tcp-3", d:"tcp", q:"TCPのTIME_WAIT状態の説明として適切なものはどれか。", c:["先に切断した側が、最後のACK送信後に一定時間接続情報を保持する状態","サーバがポートを開いて、接続要求の到着を待ち受けている状態","SYNを送信したあと、相手からSYN/ACKが届くのを待っている状態","受信ウィンドウが0になり、送信側が送信を一時停止している状態"], e:"遅れて届くセグメントが次の接続に混ざらないようにするための状態です。大量に溜まるとポート枯渇の原因になります。"},
  {id:"tcp-4", d:"tcp", q:"トランスポート層にUDPを用いるプロトコルはどれか。", c:["SNMP","SSH","SMTP","HTTP/1.1"], e:"SNMPはUDP 161（トラップは162）。SSH・SMTP・HTTP/1.1はTCPです。HTTP/3はQUIC（UDP）上で動きます。"},
  {id:"tcp-5", d:"tcp", q:"TCPのスロースタートの説明として適切なものはどれか。", c:["輻輳ウィンドウを小さく始め、ACKごとに1MSSずつ増やしていく","受信ウィンドウを0から始め、ACKごとに1バイトずつ増やしていく","パケットロスを検出したら、タイムアウトまで送信を完全に停止する","接続直後は再送タイマを止め、最初のRTTを測るまで送信を待つ"], e:"その結果、輻輳ウィンドウはRTTごとにほぼ倍増し、増え方は指数関数的になります。しきい値（ssthresh）に達すると輻輳回避フェーズに移り、増加はRTTごとに1MSS程度の線形になります。"},
  {id:"tcp-6", d:"tcp", q:"TCPのMSSの説明として適切なものはどれか。", c:["1セグメントのデータ部の最大長で、SYNのオプションで通知する","IPヘッダとTCPヘッダを含む、パケット全体の最大長である","経路上の機器は書き換えられず、端末同士だけで決める値である","受信側が一度に受け取れるデータ量で、ウィンドウの上限となる"], e:"イーサネットではMTU1500−IPヘッダ20−TCPヘッダ20＝1460バイトが一般的です。PPPoEやトンネル区間ではMSSを小さく書き換える（MSSクランプ）ことがあります。"},

  {id:"app-1", d:"app", q:"ドメインのメール受信サーバを指定するDNSのリソースレコードはどれか。", c:["MX","CNAME","PTR","NS"], e:"MXレコードで受信サーバと優先度を指定します。値が小さいほど優先されます。"},
  {id:"app-2", d:"app", q:"DHCPでIPアドレスが割り当てられるまでのメッセージの順序はどれか。", c:["DISCOVER → OFFER → REQUEST → ACK","REQUEST → OFFER → DISCOVER → ACK","DISCOVER → REQUEST → OFFER → ACK","OFFER → DISCOVER → ACK → REQUEST"], e:"DISCOVERはブロードキャストのためルータを越えません。別セグメントにDHCPサーバを置くならDHCPリレーが必要です。"},
  {id:"app-3", d:"app", q:"DHCPリレーエージェントがDHCPサーバへ転送する際に設定し、サーバがアドレスプールを選ぶ手がかりにするフィールドはどれか。", c:["giaddr","ciaddr","yiaddr","chaddr"], e:"giaddrにはリレーエージェントの受信インタフェースのアドレスが入ります。サーバはこれで端末のセグメントを判断します。"},
  {id:"app-4", d:"app", q:"送信元ドメインのDNSに登録した送信サーバのIPアドレスと照合して、なりすましメールを検知する技術はどれか。", c:["SPF","DKIM","S/MIME","STARTTLS"], e:"SPFはTXTレコードに許可する送信元IPを記述します。DKIMは電子署名で改ざんとなりすましを検知し、DMARCは両者の結果に基づく処理方針を示します。"},
  {id:"app-5", d:"app", q:"DNSキャッシュポイズニングの対策として適切なものはどれか。", c:["問合せの送信元ポート番号をランダム化する","ゾーン転送をすべてのホストに許可する","キャッシュのTTLを極端に長くして問合せを減らす","フルリゾルバをインターネット側にも公開する"], e:"ポート番号とIDの組合せを推測されにくくします。根本対策としてはDNSSECによる応答の検証があります。"},
  {id:"app-6", d:"app", q:"HTTP/2の特徴として適切なものはどれか。", c:["1つのTCPコネクション上で複数のストリームを多重化する","UDP上のQUICで通信し、TCPのHoLブロッキングを解消する","ヘッダをテキスト形式のまま、圧縮せずに送る","1リクエストごとにTCPコネクションを張り直す"], e:"HTTP/2はバイナリフレームで多重化しますが、TCPレベルのHoLブロッキングは残ります。これをQUICで解消したのがHTTP/3です。"},
  {id:"app-7", d:"app", q:"DMARCの説明として適切なものはどれか。", c:["SPF・DKIMの結果とヘッダFromの一致を基に、処理方針をDNSで公開する","送信を許可するサーバのIPアドレスをDNSのTXTレコードに列挙し、受信側が照合する","送信サーバがヘッダと本文に電子署名を付け、検証用の公開鍵をDNSで公開する","SMTPの通信開始後に暗号化へ切り替え、経路上での盗聴を防ぐ"], e:"方針はnone／quarantine／rejectの3段階で、集計レポートの送付先も指定できます。IPアドレスを列挙して照合するのはSPF、電子署名を付けるのはDKIM、通信開始後に暗号化へ切り替えるのはSTARTTLSです。"},
  {id:"app-8", d:"app", q:"SIPで、発信側が相手に通話セッションの確立を要求するメソッドはどれか。", c:["INVITE","REGISTER","BYE","OPTIONS"], e:"REGISTERは端末の所在をSIPサーバに登録、BYEは通話の終了です。音声そのものはRTPで運ばれ、そのポート番号はSDPで通知されるため、NAT越えが論点になります。"},

  {id:"sec-1", d:"sec", q:"IPsecのESPをトンネルモードで用いたときの説明として適切なものはどれか。", c:["元のIPヘッダを含むパケット全体を暗号化し、新しいIPヘッダを付ける","元のIPヘッダはそのまま残し、TCP/UDP以降のデータ部だけを暗号化する","暗号化は行わず、IPヘッダを含めて改ざんの検知だけを行う","新しいIPヘッダを付けるが、元のパケットは暗号化しない"], e:"拠点間VPNでよく使われる形態です。データ部だけを暗号化するのはトランスポートモード、暗号化せず改ざん検知だけを行うのはAHです。"},
  {id:"sec-2", d:"sec", q:"IPsecのNATトラバーサルで、ESPパケットをカプセル化するのに用いるものはどれか。", c:["UDP 4500番","TCP 443番","UDP 500番","TCP 1723番"], e:"ESPはポート番号を持たないためNAPTで変換できません。そこでUDP 4500でカプセル化します。UDP 500はIKEの通常ポートです。"},
  {id:"sec-3", d:"sec", q:"IEEE 802.1X認証で、オーセンティケータの役割を担う機器はどれか。", c:["認証スイッチや無線LANアクセスポイント","利用者のPCやスマートフォンなどの端末","RADIUSサーバなどの認証サーバ","端末にアドレスを配るDHCPサーバ"], e:"端末＝サプリカント、スイッチやAP＝オーセンティケータ、RADIUSサーバ＝認証サーバの3者構成です。"},
  {id:"sec-4", d:"sec", q:"ステートフルインスペクション型ファイアウォールの説明として適切なものはどれか。", c:["通信の状態を記録し、許可した通信の戻りを動的に通す","パケットごとに独立して、ヘッダを静的なルールと照合する","アプリケーションごとに代理で接続し直し、内容を検査する","通過する通信の内容をすべて暗号化して、盗聴を防ぐ"], e:"セッション管理テーブルを持つため、冗長構成ではセッション情報の同期がないと切替時に通信が切れます。午後の冗長化問題の定番論点です。"},
  {id:"sec-5", d:"sec", q:"TLS 1.3の特徴として適切なものはどれか。", c:["フルハンドシェイクの鍵交換は(EC)DHEで、1-RTTで完了する","鍵交換に静的RSAを必須とし、サーバ証明書の鍵で共通鍵を暗号化する","ハンドシェイクはすべて平文で行い、その後のデータだけを暗号化する","互換性のため、共通鍵暗号にRC4やCBCモードを引き続き使える"], e:"TLS 1.3では静的RSA鍵交換が廃止され、フルハンドシェイクは前方秘匿性のある方式になりました。ServerHello以降のハンドシェイクは暗号化されます。なお、PSKだけで再開する場合は前方秘匿性がありません。"},

const HAS_PAST = typeof PAST !== "undefined" && PAST && Array.isArray(PAST.a2) && PAST.a2.length > 0;

// 途中の演習（4択・過去問・事例）。1問ごとに保存し、メニューの「続きから」で再開する
const PSETS = HAS_PAST ? PAST.a2.concat(PAST.a1 || []) : [];
function pastItem(pid) {

function cleanSess(x) {

    return { k: "past", items: x.items.slice(), i: x.i, ok: x.ok, exam: x.exam === true, ans, ms: Number.isFinite(x.ms) && x.ms >= 0 ? x.ms : 0, intro: typeof x.intro === "string" ? x.intro.slice(0, 300) : "" };

// 最初の設定の途中経過（再開用）を検査して取り込む
function cleanA(a) {
  const o = { weak: Array.isArray(a.weak) ? a.weak.filter(k => DOMAINS[k]) : [], exp: ["none", "some", "pro"].includes(a.exp) ? a.exp : "some", amI: ["exempt", "none", "unknown"].includes(a.amI) ? a.amI : "none" };
  if (TARGETS.includes(a.target)) o.target = a.target;
  if (validHours(a.hours)) o.hours = a.hours;

}
function migrate(d) {

  if (!d || typeof d !== "object" || Array.isArray(d)) return s;
  const t = todayStr();
  const p = d.profile;
  if (p && typeof p === "object" && TARGETS.includes(p.target) && isDate(p.exam) && validHours(p.hours) && Array.isArray(p.weak)) {

  for (const [k, v] of Object.entries(obj(d.past))) if (/^\d{4}r\d\d[ah]_(sc|nw|koudo_am1)-\d{1,2}$/.test(k) && v && typeof v.ok === "boolean" && isDate(v.t)) s.past[k] = { ok: v.ok, t: v.t };
  for (const [k, v] of Object.entries(obj(d.pm))) if (/^\d{4}r\d\d[ah]_(sc|nw)_pm2?$/.test(k) && v && [0, 1, 2, 3].includes(v.g) && Number.isFinite(v.min) && isDate(v.t)) s.pm[k] = { g: v.g, min: v.min, t: v.t };

  for (const [k, v] of Object.entries(obj(d.log))) if (isDate(k) && v && Number.isInteger(v.n) && v.n >= 0 && Number.isFinite(v.ms) && v.ms >= 0) s.log[k] = { n: v.n, ms: v.ms };

    const A = cleanA(d.ob.A);

}
let S = blank(), storageOK = true, storageNotice = false;
try { S = migrate(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) { S = blank(); }
try { localStorage.setItem(KEY + "-probe", "1"); localStorage.removeItem(KEY + "-probe"); } catch (e) { storageOK = false; storageNotice = true; }

  catch (e) { if (storageOK) { storageOK = false; storageNotice = true; } }

/* ===== クラウド保存
   Claudeの保存領域（db）の、閲覧している本人だけが読み書きできる場所（data/users/<本人のID>/）に記録を置く。
   アプリを閉じても、別の端末で開いても続きから再開できる。使えない環境ではブラウザ内だけに保存する ===== */
let cloud = null, cloudBusy = false, cloudDirty = false, cloudTimer = 0;
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const got = await withTimeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), 8000);
    if (!got || !got[0] || !got[1]) return;
    const uid = await withTimeout(got[1].id(), 5000);
    if (!uid) return;
    const ref = got[0].doc("data/users/" + uid + "/" + KEY);
    const snap = await withTimeout(ref.get(), 8000);
    if (!snap) return;
    cloud = ref;
    let remote = null;
    if (snap.exists) { try { const b = snap.data(); remote = migrate(JSON.parse(b.s)); } catch (e) { remote = null; } }
    if (remote && remote.at > (S.at || 0)) { S = remote; saveLocal(); }
    else if ((S.at || 0) > (remote ? remote.at : 0)) pushCloud();
  } catch (e) { cloud = null; }
}
function queueCloud() { if (!cloud) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 800); }
async function pushCloud() {
  if (!cloud) return;
  if (cloudBusy) { cloudDirty = true; return; }
  cloudBusy = true;
  try { await cloud.set({ v: SCHEMA, at: S.at || Date.now(), s: JSON.stringify(S) }); }
  catch (e) {
    const code = e && e.code;
    if (code === "unavailable" || code === "resource_exhausted") { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 2000 + Math.random() * 2000); }
    else { cloud = null; storageNotice = !storageOK; }
  } finally {
    cloudBusy = false;
    if (cloudDirty) { cloudDirty = false; pushCloud(); }
  }
}
// 画面を閉じる・切り替えるときは待たずに保存する。午後の演習中なら、離れている間は時間を止める
let pmActive = null;
function pmHide() { const r = pmActive; if (r && !r.pauseAt) { r.pauseAt = Date.now(); saveLocal(); } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { pmHide(); if (cloud) { clearTimeout(cloudTimer); pushCloud(); } return; }
  const r = pmActive;

    r.paused += gap; r.pauseAt = 0; save();

// 記述の下書き（問題ごと）。「やめる」でも消さず、次に同じ問題を開くと続きから書ける
function draftMap() {

    if (!d || typeof d !== "object" || Array.isArray(d)) return {};
    if (typeof d.id === "string" && typeof d.text === "string") return d.text ? { [d.id]: d.text } : {};

// 表記ゆれの吸収: NFKC（全角→半角）、チャンネル→チャネル、カタカナ直後の長音を削除、大文字化、空白除去
const norm = s => String(s).normalize("NFKC").replace(/チャンネル/g, "チャネル").replace(/([ァ-ヴ])ー/g, "$1").toUpperCase().replace(/\s/g, "");
const clen = s => [...String(s).replace(/\s/g, "")].length;

/* ===== 開発用のデータ検証（コンソールに出る） ===== */
function grade(ans, item) {
  const A = norm(ans);
  let best = null;
  for (const g of [item.k].concat(item.alt || [])) {
    const hits = g.map(grp => grp.some(k => A.includes(norm(k))));
    const h = hits.filter(Boolean).length;
    if (!best || h / g.length > best.h / best.g.length) best = { g, hits, h };
  }
  return best;
}
(function validate() {
  const ids = new Set();
  const uniq = id => { console.assert(!ids.has(id), "重複ID", id); ids.add(id); };
  let longest = 0;
  for (const q of QUIZ) {
    uniq(q.id);
    console.assert(DOMAINS[q.d] && q.c.length === 4 && new Set(q.c).size === 4 && q.q && q.e, "4択データ不正", q.id);
    const L = q.c.map(c => [...c].length);
    if (L[0] > Math.max(...L.slice(1))) longest++;
  }
  console.assert(longest / QUIZ.length <= .3, "正解が最長の選択肢に偏っている", longest + "/" + QUIZ.length);
  const textOK = (w, id) => console.assert(Number.isInteger(w.lim) && clen(w.a) <= w.lim && w.k.every(g => g.length) && grade(w.a, w).h === w.k.length && w.note, "記述データ不正", id);
  for (const w of WRITE) { uniq(w.id); console.assert(DOMAINS[w.d] && w.s && w.q, "記述データ不正", w.id); textOK(w, w.id); }
  for (const c of CASES) {
    uniq(c.id);
    console.assert(DOMAINS[c.d] && c.fig && c.qs.length, "事例データ不正", c.id);
    c.qs.forEach((q, i) => q.type === "pick" ? console.assert(q.c.length <= 4 && q.ans >= 0 && q.ans < q.c.length && q.e, "事例の選択データ不正", c.id, i) : textOK(q, c.id + "-" + i));
  }
  const E = [EXAM.cur];
  for (const x of E) console.assert([x.applyStart, x.applyEnd, x.aStart, x.aEnd, x.bStart, x.bEnd].every(isDate) && x.applyStart <= x.applyEnd && x.aStart <= x.aEnd && x.aEnd < x.bStart && x.bStart <= x.bEnd, "試験日程の不整合", x.name);
})();

/* ===== 計画 =====

function allocate(days, ratios) {
  const n = ratios.length;
  const sum = ratios.reduce((a, b) => a + b, 0);
  const extra = days - n;
  const raw = ratios.map(r => extra * r / sum);
  const out = raw.map(x => 1 + Math.floor(x));
  let left = days - out.reduce((a, b) => a + b, 0);
  raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { out[i]++; left--; } });
  return out;
}

function buildPlan(p) {

  const start = p.start <= t ? p.start : t;
  const total = diff(start, p.exam);
  let keys, ratios;
  if (total <= 3) { keys = ["sprint"]; ratios = [1]; }

    if (total < 10) { keys = ["bmix", "last"]; ratios = [.65, .35]; }
    else { keys = ["b1", "b2", "last"]; ratios = [.4, .4, .2]; }
  } else if (total < 35) { keys = ["base", "bmix", "last"]; ratios = [.3, .5, .2]; }

function pickQuiz(n, domain, ids) {
  const weak = new Set(S.profile ? S.profile.weak : []);
  const pool = QUIZ.filter(q => (!domain || q.d === domain) && (!ids || ids.includes(q.id))).map(q => {
    const st = S.stats[q.d], rate = st && st.n ? st.c / st.n : .5;
    let w = 1 + (weak.has(q.d) ? 2 : 0) + (rate < .6 ? 1 : 0);

  const ws = WRITE.filter(w => w.d === k && S.write[w.id]).map(w => S.write[w.id].r / 2);
  const wr = ws.length ? ws.reduce((a, b) => a + b, 0) / ws.length : null;
  if (qr === null && wr === null) return weak.includes(k) ? .3 : .55;

}

  const y = await ask([{ label: "やめておく", value: false, primary: true }], { extra: [{ label: "記録をすべて消去する", value: true }] });
  if (!y) return;
  S = blank(); save(); clearDrafts(); $log.innerHTML = "";
  await onboarding(false);
}
async function otherMenu() {
  const v = await ask([
    { label: "学習計画を見る", value: "plan" },
    { label: "試験日程を見る", value: "exam" },
    { label: "計画を作り直す", value: "redo" },
    { label: "記録を消去", value: "reset", danger: true }
  ], { lead: "その他", grid: true, extra: [{ label: "← 戻る", value: null }] });
  if (v === "plan") await showPlan(false);
  else if (v === "exam") await coach(examHTML(), 300);
  else if (v === "redo") { await coach("<p>学習記録は残したまま、計画を作り直します。</p>", 250); await onboarding(true); }
  else if (v === "reset") await resetFlow();
}
function sessLabel() {
  const s = S.sess;
  if (!s) return "";
  if (s.k === "quiz") return (s.today ? "今日の学習" : "4択") + "（あと" + (s.ids.length - s.i) + "問）";
  if (s.k === "past") {
    const left = s.exam ? s.ans.filter(a => a === null).length : s.items.length - s.i, it = pastItem(s.items[0]);
    return "IPAの過去問" + (it ? " " + it.set.label : "") + (left ? "（あと" + left + "問）" : "（採点の前）");
  }
  const c = CASES.find(x => x.id === s.id);
  return "事例演習「" + c.title + "」（設問" + (s.i + 1) + "から）";
}
async function resumeSess() {
  const s = S.sess;
  if (s.k === "quiz") { if (s.today) await todaySession(s); else await runQuiz(0, null, null, { resume: s }); }
  else if (s.k === "past") await runPast(null, { resume: s });
  else await runCase(s);
}
async function moreMenu() {
  const wrong = wrongIds();
  const v = await ask([
    { label: "4択を5問（おまかせ・約5分）", value: "quiz", primary: true, full: true },
    { label: "4択の分野を選ぶ", value: "quizd" },
    { label: "10分だけ4択", value: "box" },
    { label: "記述トレーニング（約5分）", value: "write" },
    { label: "事例演習（約15分）", value: "case" },
    wrong.length ? { label: "復習リスト（" + wrong.length + "問）", value: "wrong" } : null,
    HAS_PAST ? { label: "IPAの過去問（直近5年）", value: "past" } : null,
    S.done === todayStr() ? { label: "今日の学習をもう一度", value: "today" } : null
  ].filter(Boolean), { lead: "ほかの学習", grid: true, extra: [{ label: "← 戻る", value: null }] });
  if (v === "quiz") await runQuiz(5);
  else if (v === "quizd") { const d = await pickDomain("quiz"); if (d !== null) await runQuiz(5, d || null); }
  else if (v === "box") await runQuiz(20, null, null, { box: true });
  else if (v === "write") await runWrite();
  else if (v === "case") await runCase();
  else if (v === "wrong") await runQuiz(Math.min(10, wrong.length), null, wrong);
  else if (v === "past") await pastMenu();
  else if (v === "today") await todaySession();
}
async function oneQuestion() {
  const r = await runQuiz(1, null, null, { one: true });
  if (!r.n) return;
  const first = S.done !== todayStr();
  S.done = todayStr(); save();
  await coach("<p>" + (first ? "今日の分はOKです。1問でも、続けたことに意味があります。" : "おつかれさまです。") + "</p>" + rewardHTML(), 250);
}
async function menuOnce() {
  renderStatus();
  if (storageNotice && !cloud) { storageNotice = false; await coach("<p>この環境では学習記録を保存できません。ページを閉じると記録が消えます。</p>", 200); }
  const doneToday = S.done === todayStr();
  const rec = weakest(), drafts = writeDrafts();
  const pmSet = S.pmrun ? PM.find(s => s.key === S.pmrun.key) : null;
  // 次にやることを大きなボタン1つで示す（続き → 今日の学習 → おすすめ の順）
  const opts = [];
  if (S.sess) opts.push({ label: "続きから：" + sessLabel(), value: "resume", primary: true, full: true });
  if (pmSet) opts.push({ label: "午後演習の続き（" + pmSet.label + "・経過" + pmMin(S.pmrun) + "分）", value: "pm", primary: !opts.length, full: true });
  if (!doneToday) opts.push({ label: "今日の学習（約10分）", value: "today", primary: !opts.length, full: true });
  else if (!opts.length) opts.push({ label: "おすすめ：" + DOMAINS[rec] + "の4択（約5分）", value: "rec", primary: true, full: true });
  if (drafts.length) opts.push({ label: "書きかけの記述を続ける", value: "draft", full: true });
  opts.push({ label: "1問だけ（約1分）", value: "one" }, { label: "ほかの学習…", value: "more" });
  const v = await ask(opts, { lead: doneToday ? "今日の分は完了しています ✓" : "次は何をしますか", grid: true, extra: [{ label: "進捗を見る", value: "progress" }, { label: "その他", value: "other" }] });
  if (v === "resume") await resumeSess();
  else if (v === "pm") await runPm(pmSet);
  else if (v === "today") await todaySession();
  else if (v === "rec") await runQuiz(5, rec);
  else if (v === "draft") await runWrite(null, drafts[0].id);
  else if (v === "one") await oneQuestion();
  else if (v === "more") await moreMenu();
  else if (v === "progress") await showProgress();
  else if (v === "other") await otherMenu();
}
async function menu() {
  for (;;) {
    try { await menuOnce(); }
    catch (e) { console.error(e); await coach("<p>表示中に問題が起きました。メニューに戻ります。</p>", 0); }
  }
}
async function main() {
  // 端末内の保存データをブラウザに自動削除させないよう依頼する（対応ブラウザのみ）
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  const wait = document.createElement("div");
  wait.className = "msg";
  wait.innerHTML = '<div class="av" aria-hidden="true">' + AV + '</div><div class="bub"><span class="typing" aria-hidden="true"><i></i><i></i><i></i></span> <span class="small">記録を読み込んでいます</span></div>';
  $log.appendChild(wait);
  await cloudInit();
  wait.remove();
  renderStatus();
  if (!cloud && window.claude && (S.profile || S.ob)) await coach('<p class="small">この表示では、記録はこのブラウザの中にだけ保存されます。Claudeにログインした状態で開くと、どの端末からでも続きから再開できます。</p>', 0);
  if (!S.profile) await onboarding(false);
  else {
    const p = S.profile;
    const plan = buildPlan(p);
    const s = streak();
    const t = todayStr();
    let extra = "";
    if (plan.done) await coach("<p>おかえりなさい。設定した試験日（" + esc(slash(p.exam)) + "）を過ぎました。おつかれさまでした。</p><p>次の試験を目指すなら「その他」→「計画を作り直す」で目標を設定してください。演習はこのまま続けられます。</p>");
    else if (plan.today) await coach("<p>おかえりなさい。今日が試験日です。新しいことには手を出さず、弱点ノートを軽く見直して臨みましょう。</p>");
    else await coach("<p>おかえりなさい。試験まであと <strong>" + plan.days + "日</strong>、いまはP" + (currentPhase(plan)+1) + "「" + esc(plan.phases[currentPhase(plan)].t) + "」の期間です。" +
      (s ? "連続" + s + "日学習中です。" : S.days.length ? "また今日から始めましょう。" : "") + (S.sess || S.pmrun ? "前回の続きから再開できます。" : "") + "</p>" + (S.days.length ? weekHTML() : "") + extra);
  }
  await menu();
}
main().catch(e => {
  console.error(e);
  $dock.innerHTML = '<p class="lead">読み込み中に問題が起きました。</p><button type="button" class="opt primary" id="rl">再読み込み</button><button type="button" class="opt danger" id="wipe">記録を消去して再開</button>';
  document.getElementById("rl").onclick = () => location.reload();
  document.getElementById("wipe").onclick = () => { try { localStorage.removeItem(KEY); } catch (_) {} location.reload(); };
});
</script>

<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
